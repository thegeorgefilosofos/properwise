<!-- ΤΟ ΧΡΟΝΟΛΟΓΙΟ, ΜΙΑ ΠΗΓΗ: η ταινία και ο ήχος (sound.ts). Χτύποι των 120 BPM (0,5″).
     «Σχεδόν τίποτα δεν πατάς»: δύο πατήματα σε όλη την ταινία (Σάρωσε έγγραφο, Κατέβασε). -->
<script id="timeline" type="application/json">
{
  "bpm": 120, "beats": 52, "fps": 30, "cover": 24.6,
  "scenes": [5, 15, 26, 36, 46],
  "turns": [26, 36],
  "reveal": 5,
  "rowsOver": [7.0, 7.6, 8.2, 8.8],
  "sheetUp": 16.6,
  "fill": [18.4, 19.1],
  "ticks": [19.2, 19.6, 20.0],
  "rowsDocs": [28.0, 28.5, 29.0, 29.5, 30.0, 30.5],
  "taps": [16.4, 39.0],
  "packUp": 40.0,
  "rowsPack": [40.8, 41.3, 41.8, 42.3, 42.8],
  "entries": [0, 0.8, 1.6, 5.6, 15.3, 26.3, 36.3, 46, 46.4, 46.8],
  "bells": [0, 46],
  "chords": [[0, ["A2", "E3", "A3", "C4", "E4"]], [5, ["F2", "C3", "F3", "A3", "C4"]], [15, ["C3", "G3", "C4", "E4", "G4"]], [26, ["G2", "D3", "G3", "B3", "D4"]], [36, ["A2", "E3", "A3", "C4", "E4"]], [46, ["F2", "C3", "F3", "A3", "E4"]]]
}

<script>
(() => {
const TL = JSON.parse(document.getElementById('timeline').textContent);
const BEAT = 60 / TL.bpm, FPS = TL.fps, HALF = 4 / FPS;
const B = (b) => b * BEAT;
const fmt = new URLSearchParams(location.search).get('f') === '45' ? '45' : '916';
const W = 1080, H = fmt === '45' ? 1350 : 1920;
const px = Math.round, clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const $ = (id) => document.getElementById(id);
const ease = (u) => (u <= 0 ? 0 : u >= 1 ? 1 : u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2);
const tween = (t, b, dur) => ease((t - B(b)) / dur);
// Τα κουτιά της εφαρμογής (px εφαρμογής, από το work/shots6/boxes.json).
const BOX = {
  pending: { x: 16, y: 264, w: 358, h: 398 }, enfia: { x: 17, y: 307, w: 356, h: 67 }, scanBtn: { x: 16, y: 206, w: 175, h: 36 },
  fields: { x: 16, y: 528, w: 358, h: 184 }, updates: { x: 21, y: 460, w: 348, h: 40 },
  prov: { x: 24, y: 584, w: 342, h: 41 }, afm: { x: 24, y: 661, w: 166, h: 43 }, date: { x: 202, y: 663, w: 162, h: 39 },
  docs: { x: 16, y: 366, w: 358, h: 383 }, docEnfia: { x: 22, y: 470, w: 346, h: 54 },
  card: { x: 26, y: 284, w: 338, h: 284 }, download: { x: 38, y: 523, w: 119, h: 36 },
  pack: { x: 0, y: 380, w: 390, h: 464 },
};
const PROV_N = 22;
// Τα περιεχόμενα του zip: PACK_FILES του lib/accounting/meetingPack.ts, με τη σειρά του packEntries
// και του meetingPackExport.ts (το «04 ΑΑΔΕ» μπαίνει μόνο όταν έχει ανέβει το προσυμπληρωμένο Ε2).
const ZIP = 'Φάκελος λογιστή 2026 ΑΦΜ 099123456.zip';
const PACK = [
  ['doc', '00 Σύνοψη.pdf', ''],
  ['sheet', '01 Ε2 2026.xlsx', ''],
  ['sheet', '02 Έλεγχος φακέλου.xlsx', ''],
  ['folder', '03 Παραστατικά', 'ένας φάκελος ανά ακίνητο'],
  ['sheet', '05 Κωδικοί Ε1 και Ε2.xlsx', ''],
];

// ── ΔΙΑΤΑΞΗ: ίδιο τηλέφωνο, ίδια κλίμακα κοντινού σε κάθε σκηνή ──────────
const L = fmt === '916'
  ? { K: 2.0, Zc: 1.4, zoneH: 470, fade: 110, capTop: 246, capSize: 72, capW: 1000, badgeY: 418, wideY: 560, closeY: 1050,
      msgY: 700, msgSize: 116, msgGap: 140, logoW: 640, logoY: 690, cMsgY: 860, cMsgSize: 84, cMsgGap: 100, urlY: 1200, urlSize: 46 }
  : { K: 1.62, Zc: 1.7, zoneH: 230, fade: 70, capTop: 40, capSize: 56, capW: 1020, badgeY: 182, wideY: 270, closeY: 790,
      msgY: 470, msgSize: 104, msgGap: 124, logoW: 560, logoY: 420, cMsgY: 560, cMsgSize: 76, cMsgGap: 90, urlY: 880, urlSize: 42 };
const K = L.K, SB = 47, APPW = 390, APPH = 844;
const SW = APPW * K, SH = (SB + APPH) * K, BEZ = 13, PW = SW + 2 * BEZ, PH = SH + 2 * BEZ, RAD = 54 * K, PRAD = RAD + BEZ;
const stage = $('stage');
stage.style.width = W + 'px'; stage.style.height = H + 'px';
Object.assign($('rig').style, { width: PW + 'px', height: PH + 'px' });
Object.assign($('body').style, { borderRadius: PRAD + 'px' });
Object.assign($('screen').style, { left: BEZ + 'px', top: BEZ + 'px', width: SW + 'px', height: SH + 'px', borderRadius: RAD + 'px' });
const btn = (id, side, y, h) => Object.assign($(id).style, { left: (side < 0 ? -4 : PW - 1) + 'px', top: y * K + 'px', width: '5px', height: h * K + 'px' });
btn('b1', -1, 120, 30); btn('b2', -1, 175, 58); btn('b3', -1, 245, 58); btn('b4', 1, 200, 92);
Object.assign($('status').style, { height: SB * K + 'px' });
Object.assign($('island').style, { left: (SW - 124 * K) / 2 + 'px', top: 11 * K + 'px', width: 124 * K + 'px', height: 36 * K + 'px' });
Object.assign(document.querySelector('#status .time').style, { left: 34 * K + 'px', top: 15 * K + 'px', fontSize: 17 * K + 'px', lineHeight: 1 });
const ico = (id, x, w, h) => Object.assign($(id).style, { left: x * K + 'px', top: (23 - h / 2) * K + 'px', width: w * K + 'px', height: h * K + 'px' });
ico('sig', 286, 18, 12); ico('wifi', 310, 16, 12); ico('batt', 332, 27, 13);
Object.assign($('app').style, { top: SB * K + 'px', width: SW + 'px', height: APPH * K + 'px' });
for (const l of document.querySelectorAll('.layer')) Object.assign(l.style, { width: SW + 'px', height: APPH * K + 'px' });
const place = (el, r) => Object.assign(el.style, { left: r.x * K + 'px', top: r.y * K + 'px', width: r.w * K + 'px', height: r.h * K + 'px' });
for (const id of ['overEmpty', 'overBase', 'scanBase', 'docsEmpty', 'docsBase', 'accBase', 'accBusy']) Object.assign($(id).style, { width: SW + 'px', height: APPH * K + 'px' });
place($('scanFields'), BOX.fields); place($('accCard'), BOX.card); place($('accCardBusy'), BOX.card);
const stateImgs = (clipId, prefix, idx, r) => {
  const c = $(clipId); place(c, r);
  return idx.map((i) => { const im = document.createElement('img'); im.src = `work/shots6/${prefix}-${i < 10 && prefix !== 'pend' && prefix !== 'docs' ? String(i).padStart(2, '0') : i}.png`;
    Object.assign(im.style, { width: '100%', height: '100%', visibility: 'hidden' }); c.appendChild(im); return im; });
};
// Η άδεια κάρτα (λήψη της εφαρμογής με τις γραμμές κρυμμένες) και οι γραμμές της μία μία, από την ίδια λήψη ×9.
const ROWS_OV = [[307, 67], [374, 108], [482, 89], [571, 86]], ROWS_DOC = Array.from({ length: 6 }, (_, i) => [419 + 53 * i, 53]);
const rowImgs = (clipId, prefix, rows, box) => rows.map(([y, h], i) => { const im = document.createElement('img'); im.src = `work/shots6/${prefix}-${i}.png`;
  Object.assign(im.style, { left: 0, top: (y - box.y) * K + 'px', width: box.w * K + 'px', height: h * K + 'px', visibility: 'hidden' }); $(clipId).appendChild(im); return im; });
const pendEmpty = stateImgs('pendClip', 'pend', [0], BOX.pending)[0], pendRows = rowImgs('pendClip', 'prow', ROWS_OV, BOX.pending);
const docsEmpty = stateImgs('docsClip', 'docs', [0], BOX.docs)[0], docsRows = rowImgs('docsClip', 'drow', ROWS_DOC, BOX.docs);
const provs = stateImgs('provClip', 'prov', Array.from({ length: PROV_N + 1 }, (_, i) => i), BOX.prov);
const afms = stateImgs('afmClip', 'afm', [0, 9], BOX.afm);
const TICKS = [[BOX.prov, 't1', 32], [BOX.afm, 't2', 32], [BOX.date, 't3', 62]];
for (const [r, id, off] of TICKS) Object.assign($(id).style, { left: (r.x + r.w - off) * K + 'px', top: (r.y + r.h / 2 - 11) * K + 'px', width: 22 * K + 'px', height: 22 * K + 'px' });
// Το φύλλο του πακέτου.
const pack = $('pack'); place(pack, BOX.pack);
Object.assign(pack.style, { borderRadius: `${20 * K}px ${20 * K}px 0 0` });
Object.assign(pack.querySelector('.grab').style, { left: (195 - 18) * K + 'px', top: 8 * K + 'px', width: 36 * K + 'px', height: 5 * K + 'px' });
Object.assign(pack.querySelector('.title').style, { left: 22 * K + 'px', top: 26 * K + 'px', width: 346 * K + 'px', fontSize: 17 * K + 'px' });
pack.querySelector('.title').textContent = ZIP;
const ICON = { doc: 'M6 3 H13 L17 7 V20 H6 Z M13 3 V7 H17', sheet: 'M5 4 H18 V19 H5 Z M5 9 H18 M5 14 H18 M10 4 V19', folder: 'M3 7 H9 L11 9 H20 V18 H3 Z' };
const packRows = PACK.map(([kind, name, sub], i) => {
  const r = document.createElement('div'); r.className = 'row';
  Object.assign(r.style, { left: 22 * K + 'px', top: (80 + i * 62) * K + 'px', width: 346 * K + 'px', height: 62 * K + 'px', gap: 12 * K + 'px' });
  r.innerHTML = `<div class="ic" style="width:${36 * K}px;height:${36 * K}px"><svg viewBox="0 0 23 23" width="${22 * K}" height="${22 * K}"><path d="${ICON[kind]}"/></svg></div>`
    + `<div><div class="nm" style="font-size:${16 * K}px">${name}</div>${sub ? `<div class="sub" style="font-size:${13 * K}px;margin-top:${2 * K}px">${sub}</div>` : ''}</div>`;
  pack.appendChild(r); return r;
});

// ── Η ΚΑΜΕΡΑ: δύο κλίμακες (ολόκληρο, κοντινό), κατά μέτωπο όσο φαίνεται κείμενο ──
// [χτύπος, ζουμ 0|1, κέντρο σε px εφαρμογής]· κάθε αλλαγή σε 0,5″, χωρίς υπερακόντιση.
// Στο 4:5 το φύλλο δεν χωρά ολόκληρο στο κοντινό: η κάμερα και ο προβολέας κρατούν τις γραμμές των αρχείων.
const PACK_FOCUS = fmt === '916' ? BOX.pack.y + 200 : BOX.pack.y + 236;
const PACK_SPOT = fmt === '916' ? { x: 12, y: BOX.pack.y + 6, w: 366, h: 392 } : { x: 12, y: BOX.pack.y + 72, w: 366, h: 326 };
const CAMK = [
  [5, 0, 0], [6.2, 1, BOX.pending.y + BOX.pending.h / 2], [13.6, 0, 0],
  [17.4, 1, BOX.fields.y + BOX.fields.h / 2 - 50], [24.6, 0, 0],
  [27.0, 1, BOX.docs.y + BOX.docs.h / 2], [34.6, 0, 0],
  [37.0, 1, BOX.card.y + BOX.card.h / 2], [40.2, 1, PACK_FOCUS], [46, 1, PACK_FOCUS],
];
function camAt(t) {
  let z = 0, ay = 0;
  for (let k = 0; k < CAMK.length; k++) {
    const [b, zz, a] = CAMK[k];
    if (k === 0) { z = zz; ay = a; continue; }
    const u = tween(t, b, 0.5);
    z += (zz - z) * u; ay += (a - ay) * u;
  }
  return { z, ay };
}
const SC = TL.scenes;
function camera(t) {
  const { z, ay: aFocus } = camAt(t);
  const Z = 1 + (L.Zc - 1) * z;
  const ay = (1 - z) * (-SB) + z * aFocus;
  const Y = (1 - z) * (L.wideY + BEZ) + z * L.closeY;
  const enterU = tween(t, TL.reveal, 0.4), exitU = tween(t, SC[4], 0.35);
  let ry = 0;
  for (const b of TL.turns) { const u = (t - B(b) + 0.2) / 0.4; if (u > 0 && u < 1) ry = 7 * Math.sin(Math.PI * u); }
  const rx = 14 * (1 - enterU) * (t >= B(TL.reveal) ? 1 : 0);
  const dy = (1 - enterU) * H * 0.9 + exitU * H * 0.9;
  return { Z, ay, Y: Y + dy, rx, ry, z };
}

// ── ΚΕΙΜΕΝΑ ──────────────────────────────────────────────────────────────
const texts = $('texts'), T = [];
function text(cls, s, style, tin, tout) {
  const el = document.createElement('div'); el.className = 'txt ' + cls; el.textContent = s;
  Object.assign(el.style, style); texts.appendChild(el); T.push({ el, tin: B(tin), tout: B(tout) }); return el;
}
const centered = (top, w, size) => ({ left: px((W - w) / 2) + 'px', top: top + 'px', width: w + 'px', fontSize: size + 'px' });
const END = TL.beats + 1;
const MSG = ['Κάθε ακίνητο.', 'Κάθε υποχρέωση.', 'Ένα μέρος.'];

MSG.forEach((m, i) => text('msg', m, { ...centered(L.cMsgY + i * L.cMsgGap, 1060, L.cMsgSize), color: i === 2 ? 'var(--mkt-accent)' : '' }, 46.4 + i * 0.3, END));

// Προβολέας ανά σκηνή: [από χτύπο, ως χτύπο, κουτί]· αλλάζει κουτί με ομαλή μετακίνηση 0,3″.
const SPOTS = [

  [31.0, 34.4, BOX.docEnfia],

// ── render(t) ────────────────────────────────────────────────────────────
const S = (el) => el.style;
const stepCount = (t, list) => list.filter((b) => t >= B(b)).length;
window.render = function render(t) {
  const sig = [];
  Object.assign(S($('g1')), { width: '1300px', height: '1300px', left: px(-260 + 180 * Math.sin(t / 4.2)) + 'px', top: px(H * 0.2 + 120 * Math.cos(t / 5.3)) + 'px' });
  Object.assign(S($('g2')), { width: '1100px', height: '1100px', left: px(420 + 160 * Math.cos(t / 3.7)) + 'px', top: px(H * 0.55 + 110 * Math.sin(t / 4.9)) + 'px' });

  const c = camera(t);
  const on = t >= B(TL.reveal) && t < B(SC[4]) + 0.4;
  S($('rig')).display = on ? 'block' : 'none';
  if (on) {
    const fx = BEZ + 195 * K, fy = BEZ + (SB + c.ay) * K;
    const x0 = px(W / 2 - fx * c.Z), y0 = px(c.Y - fy * c.Z);
    const rot = c.rx || c.ry ? ` translate(${fx}px, ${fy}px) rotateX(${c.rx.toFixed(3)}deg) rotateY(${c.ry.toFixed(3)}deg) translate(${-fx}px, ${-fy}px)` : '';
    const tr = `translate(${x0}px, ${y0}px) scale(${c.Z.toFixed(5)})${rot}`;
    S($('rig')).transform = tr; sig.push(tr);
  }
  const sharp = c.z > 0.5;
  for (const id of ['scanFields', 'accCard', 'accCardBusy']) S($(id)).visibility = sharp ? 'visible' : 'hidden';
  // Οθόνες.
  const layer = t < B(SC[2]) ? 'Lover' : t < B(SC[3]) ? 'Ldocs' : 'Lacc';
  for (const id of ['Lover', 'Ldocs', 'Lacc']) S($(id)).display = id === layer ? 'block' : 'none';
  const up = layer === 'Lover' ? tween(t, TL.sheetUp, 0.4) : 0;
  S($('Lscan')).display = up > 0 ? 'block' : 'none';
  S($('Lscan')).transform = `translateY(${px((1 - up) * (APPH - 84 + 20) * K)}px)`;
  S($('Lscan')).clipPath = `inset(${84 * K}px 0 0 0)`;
  S($('dimOver')).opacity = (0.55 * up).toFixed(3);
  sig.push(layer, up.toFixed(4), sharp);
  // Η λίστα των προθεσμιών εμφανίζεται μόνη της, γραμμή γραμμή.

  S($('overEmpty')).display = np < 4 ? 'block' : 'none'; S($('overBase')).display = np < 4 ? 'none' : 'block';
  const pv = np < 4 || sharp;
  pendEmpty.style.visibility = pv ? 'visible' : 'hidden';
  pendRows.forEach((im, i) => { im.style.visibility = pv && i < np ? 'visible' : 'hidden'; });
  // Τα πεδία γεμίζουν από τη σάρωση (ο Πάροχος, μετά ο ΑΦΜ) και παίρνουν ✓.
  const pu = clamp((t - B(TL.fill[0])) / (B(TL.fill[1]) - B(TL.fill[0])), 0, 1), pi = Math.floor(pu * PROV_N + 1e-6);
  provs.forEach((im, i) => { im.style.visibility = i === pi ? 'visible' : 'hidden'; });
  const afmOn = t >= B(TL.ticks[1]) - 0.1 ? 1 : 0;
  afms.forEach((im, i) => { im.style.visibility = i === afmOn ? 'visible' : 'hidden'; });
  TL.ticks.forEach((b, k) => {
    const u = clamp((t - B(b)) / 0.18, 0, 1), el = $('t' + (k + 1));
    el.style.display = u > 0 && up > 0.99 ? 'block' : 'none';
    el.style.opacity = u.toFixed(3); el.style.transform = `scale(${(0.6 + 0.4 * u).toFixed(3)})`; sig.push(u.toFixed(3));
  });
  // Ο Φάκελος ακινήτου οργανώνεται μόνος του σε φακέλους.
  const nd = stepCount(t, TL.rowsDocs);
  S($('docsEmpty')).display = nd < 6 ? 'block' : 'none'; S($('docsBase')).display = nd < 6 ? 'none' : 'block';
  const dv = nd < 6 || sharp;
  docsEmpty.style.visibility = dv ? 'visible' : 'hidden';
  docsRows.forEach((im, i) => { im.style.visibility = dv && i < nd ? 'visible' : 'hidden'; });
  // «Κατέβασε» → «Ετοιμάζεται». Μετά ανεβαίνει το πακέτο με τα περιεχόμενά του.
  const busy = t >= B(TL.taps[1]) + 0.06;
  S($('accBase')).display = busy ? 'none' : 'block'; S($('accBusy')).display = busy ? 'block' : 'none';
  S($('accCard')).opacity = busy ? '0' : '1'; S($('accCardBusy')).opacity = busy ? '1' : '0';
  const pk = tween(t, TL.packUp, 0.4);
  S(pack).display = pk > 0 ? 'block' : 'none';
  S(pack).transform = `translateY(${px((1 - pk) * (BOX.pack.h + 20) * K)}px)`;
  const nr = stepCount(t, TL.rowsPack);
  packRows.forEach((r, i) => { r.style.opacity = i < nr ? clamp((t - B(TL.rowsPack[i])) / 0.15, 0, 1).toFixed(3) : '0'; });
  sig.push(np, nd, pi, afmOn, busy, pk.toFixed(4), nr);
  // Προβολέας.
  let sp = null, so = 0;
  for (let k = 0; k < SPOTS.length; k++) {
    const [a, b, r] = SPOTS[k];
    if (t >= B(a) && t < B(b)) {
      const prev = k > 0 && SPOTS[k - 1][1] === a ? SPOTS[k - 1][2] : null;
      const u = prev ? ease((t - B(a)) / 0.3) : 1;
      sp = prev ? { x: prev.x + (r.x - prev.x) * u, y: prev.y + (r.y - prev.y) * u, w: prev.w + (r.w - prev.w) * u, h: prev.h + (r.h - prev.h) * u } : r;
      const next = k + 1 < SPOTS.length && SPOTS[k + 1][0] === b;
      so = Math.min(prev ? 1 : clamp((t - B(a)) / 0.25, 0, 1), next ? 1 : clamp((B(b) - t) / 0.2, 0, 1));

  }

  if (sp) Object.assign(S($('spot')), { left: (sp.x - 4) * K + 'px', top: (sp.y - 4) * K + 'px', width: (sp.w + 8) * K + 'px', height: (sp.h + 8) * K + 'px' });
  sig.push(so.toFixed(3), sp ? sp.y.toFixed(2) : '');
  // Δάχτυλο: δύο πατήματα σε όλη την ταινία.
  const TAPS = [[TL.taps[0], [BOX.scanBtn.x + 80, BOX.scanBtn.y + 18]], [TL.taps[1], [BOX.download.x + 60, BOX.download.y + 18]]];
  let fxy = null, press = 0, ring = -1;
  for (const [b, p] of TAPS) {
    const d = t - B(b);

    sig.push(press.toFixed(3));

    sig.push(ring.toFixed(3));

  S(url).opacity = uo.toFixed(3); S(url).display = uo > 0 ? 'block' : 'none';
  sig.push(ao.toFixed(3), co.toFixed(3), uo.toFixed(3));

};
