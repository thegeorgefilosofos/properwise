<script>
(() => {
const TL = JSON.parse(document.getElementById('timeline').textContent);
const FPS = TL.fps;
const fmt = new URLSearchParams(location.search).get('f') === '45' ? '45' : '916';
const W = 1080, H = fmt === '45' ? 1350 : 1920;
const px = Math.round, clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const $ = (id) => document.getElementById(id);
const ease = (u) => (u <= 0 ? 0 : u >= 1 ? 1 : u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2);
const lin = (t, a, d) => clamp((t - a) / d, 0, 1);
const BOXES = { overview: { scan: { x: 16, y: 206, w: 175, h: 36 }, rows: [[307, 67], [373, 109], [483, 87], [570, 87]] },
  photo: { x: 25, y: 255, w: 340, h: 112 },
  prov: { x: 26, y: 297, w: 338, h: 37 }, afm: { x: 26, y: 374, w: 162, h: 39 }, amount: { x: 26, y: 493, w: 304, h: 38 },
  dates: [{ x: 216, y: 383, w: 83, h: 21 }, { x: 40, y: 580, w: 83, h: 21 }, { x: 40, y: 658, w: 83, h: 21 }, { x: 216, y: 658, w: 83, h: 21 }],
  save: { x: 25, y: 794, w: 340, h: 36 }, power: { x: 29, y: 577, w: 332, h: 53 },
  accCropY: 460, download: { x: 38, y: 523, w: 119, h: 36 }, afmBlock: { x: 26, y: 462, w: 338, h: 104 } };
const PROV_N = 22;
// Τα περιεχόμενα του zip: PACK_FILES του lib/accounting/meetingPack.ts, με τη σειρά του packEntries.
// Δείχνονται τα 00 έως 03, συνεχόμενα (το 04 ΑΑΔΕ μπαίνει μόνο όταν έχει ανέβει το προσυμπληρωμένο Ε2).
const ZIP = 'Φάκελος λογιστή 2026 ΑΦΜ 099123456.zip';
const PACK = [
  ['doc', '00 Σύνοψη.pdf', ''],
  ['sheet', '01 Ε2 2026.xlsx', ''],
  ['sheet', '02 Έλεγχος φακέλου.xlsx', ''],

];

// ── ΔΙΑΤΑΞΗ ───────────────────────────────────────────────────────────────
// Ζώνη λεζάντας πάνω (συμπαγής ως zoneEnd, διαβάθμιση 60px), ζώνη ασφαλείας κάτω (από bandTop, διαβάθμιση 60px).
// Το περιεχόμενο κάθε πλάνου πέφτει ανάμεσα: C0 ως C1.
const L = fmt === '916'
  ? { zoneEnd: 520, bandTop: 1500, capMid: 335, capSize: 66, capW: 980, pillY: 446, pillH: 66, tapsSize: 40, badgeSize: 30,
      hookY: [790, 910], hookSize: 100, logoW: 660, logoY: 640, cMsgY: 820, cMsgSize: 84, cMsgGap: 100, urlY: 1160, urlSize: 46 }
  : { zoneEnd: 300, bandTop: 1290, capMid: 120, capSize: 54, capW: 1000, pillY: 222, pillH: 58, tapsSize: 36, badgeSize: 26,
      hookY: [560, 670], hookSize: 92, logoW: 600, logoY: 420, cMsgY: 590, cMsgSize: 76, cMsgGap: 90, urlY: 900, urlSize: 42 };
const C0 = L.zoneEnd + 60, C1 = L.bandTop;
// Η συσκευή σχεδιάζεται σε K px ανά px εφαρμογής· κάθε πλάνο τη μεγεθύνει σε s px κάδρου ανά px (Z = s/K).
const K = 2, SB = 47, APPW = 390, APPH = 844;
const SW = APPW * K, SH = (SB + APPH) * K, BEZ = 13, PW = SW + 2 * BEZ, PH = SH + 2 * BEZ, RAD = 54 * K, PRAD = RAD + BEZ;
const stage = $('stage');
stage.style.width = W + 'px'; stage.style.height = H + 'px';
Object.assign($('rig').style, { width: PW + 'px', height: PH + 'px' });
Object.assign($('body').style, { borderRadius: PRAD + 'px' });
Object.assign($('screen').style, { left: BEZ + 'px', top: BEZ + 'px', width: SW + 'px', height: SH + 'px', borderRadius: RAD + 'px' });
const btn = (id, side, y, h) => Object.assign($(id).style, { left: (side < 0 ? -4 : PW - 1) + 'px', top: y * K + 'px', width: '5px', height: h * K + 'px' });
btn('b1', -1, 120, 30); btn('b2', -1, 175, 58); btn('b3', -1, 245, 58); btn('b4', 1, 200, 92);
Object.assign($('status').style, { height: SB * K + 'px' });
Object.assign($('island').style, { left: (SW - 124 * K) / 2 + 'px', top: 11 * K + 'px', width: 124 * K + 'px', height: 36 * K + 'px' });
Object.assign(document.querySelector('#status .time').style, { left: 34 * K + 'px', top: 15 * K + 'px', fontSize: 17 * K + 'px', lineHeight: 1 });
const ico = (id, x, w, h) => Object.assign($(id).style, { left: x * K + 'px', top: (23 - h / 2) * K + 'px', width: w * K + 'px', height: h * K + 'px' });
ico('sig', 286, 18, 12); ico('wifi', 310, 16, 12); ico('batt', 332, 27, 13);
Object.assign($('app').style, { top: SB * K + 'px', width: SW + 'px', height: APPH * K + 'px' });
for (const l of document.querySelectorAll('.shot')) Object.assign(l.style, { width: SW + 'px', height: APPH * K + 'px' });
const place = (el, r) => Object.assign(el.style, { left: r.x * K + 'px', top: r.y * K + 'px', width: r.w * K + 'px', height: r.h * K + 'px' });
for (const im of document.querySelectorAll('#S_dead > img, #S_tiles img, #S_form > img, #S_save img, #S_docs img'))
  Object.assign(im.style, { width: SW + 'px', height: APPH * K + 'px' });

const provs = Array.from({ length: PROV_N + 1 }, (_, i) => addImg($('S_form'), `work/shots8/prov-${String(i).padStart(2, '0')}.png`, pad2(BOXES.prov)));

const TICKS = [[BOXES.prov, 't1', 32], [BOXES.afm, 't2', 32], [BOXES.amount, 't3', 32]];
for (const [r, id, off] of TICKS) Object.assign($(id).style, { left: (r.x + r.w - off) * K + 'px', top: (r.y + r.h / 2 - 11) * K + 'px', width: 22 * K + 'px', height: 22 * K + 'px' });
// Η κάμερα: το χαρτί του πάγκου (επικεφαλίδα «Λογαριασμός» και γραμμές χρεώσεων) και το κλείστρο.
{
  const paper = $('paper'), P = { x: 82, y: 96, w: 226, h: 314 };
  place(paper, P); paper.style.transform = 'rotate(-2.2deg)';
  Object.assign(paper.querySelector('.h').style, { left: 18 * K + 'px', top: 22 * K + 'px', fontSize: 17 * K + 'px' });
  for (let i = 0; i < 10; i++) { const d = document.createElement('div'); d.className = 'ln';
    Object.assign(d.style, { left: 18 * K + 'px', top: (60 + i * 22) * K + 'px', width: (120 + (i * 37) % 90) * K + 'px', height: 6 * K + 'px' }); paper.appendChild(d); }
  const G = { x: 60, y: 76, w: 270, h: 354 }, cl = 26, bw = 3 * K;
  [['c1', 0, 0, 'Top', 'Left'], ['c2', 1, 0, 'Top', 'Right'], ['c3', 0, 1, 'Bottom', 'Left'], ['c4', 1, 1, 'Bottom', 'Right']].forEach(([id, rx, ry, a, b]) => {
    Object.assign($(id).style, { left: (G.x + rx * (G.w - cl)) * K + 'px', top: (G.y + ry * (G.h - cl)) * K + 'px', width: cl * K + 'px', height: cl * K + 'px',

const pack = $('pack'); place(pack, PACK_BOX);
Object.assign(pack.style, { borderRadius: `${20 * K}px ${20 * K}px 0 0` });

Object.assign(titleEl.style, { left: 20 * K + 'px', top: 24 * K + 'px', fontSize: 15 * K + 'px' });
titleEl.textContent = ZIP;
const ICON = { doc: 'M6 3 H13 L17 7 V20 H6 Z M13 3 V7 H17', sheet: 'M5 4 H18 V19 H5 Z M5 9 H18 M5 14 H18 M10 4 V19', folder: 'M3 7 H9 L11 9 H20 V18 H3 Z' };
const packRows = PACK.map(([kind, name, sub], i) => {
  const r = document.createElement('div'); r.className = 'row';
  Object.assign(r.style, { left: 20 * K + 'px', top: (64 + i * 58) * K + 'px', width: 350 * K + 'px', height: 58 * K + 'px', gap: 12 * K + 'px' });
  r.innerHTML = `<div class="ic" style="width:${34 * K}px;height:${34 * K}px"><svg viewBox="0 0 23 23" width="${21 * K}" height="${21 * K}"><path d="${ICON[kind]}"/></svg></div>`
    + `<div><div class="nm" style="font-size:${16 * K}px">${name}</div>${sub ? `<div class="sub" style="font-size:${13 * K}px;margin-top:${2 * K}px">${sub}</div>` : ''}</div>`;
  pack.appendChild(r); return r;
});
$('dimAcc').style.top = '0px'; $('dimAcc').style.height = APPH * K + 'px';

// ── ΠΛΑΝΑ: καθαρές κοπές, ένα κάδρο το καθένα ────────────────────────────
// s: px κάδρου ανά px εφαρμογής· [ay, sy]: το σημείο ay της εφαρμογής πέφτει στο y κάδρου sy.
// Κανένα πλάνο δεν δείχνει την κάτω μπάρα ή την «Καταχώρηση» κάτω από το C1.
const CUT = TL.cuts;
const SHOTS = [
  { id: 'S_dead', from: CUT[0], to: CUT[1], s: 1.95, ay: 196, sy: C0 + 10 },
  { id: 'S_tiles', from: CUT[1], to: CUT[2], s: 2.2, ay: 90, sy: C0 + 10 },
  { id: 'cam', from: CUT[2], to: CUT[3], s: 2.0, ay: 76, sy: C0 + 10 },
  { id: 'S_form', from: CUT[3], to: CUT[4], s: 2.2, ay: 232, sy: C0 + 60 },
  { id: 'S_save', from: CUT[4], to: CUT[5], s: 2.2, ay: 842, sy: C1 - 16 },
  { id: 'S_docs', from: CUT[5], to: CUT[6], s: 2.2, ay: 357, sy: C0 + 10 },
  { id: 'S_acc', from: CUT[6], to: CUT[7], s: 2.45, ay: 780, sy: C1 },
];
const shotAt = (t) => SHOTS.find((x) => t >= x.from && t < x.to) || null;

// ── ΚΕΙΜΕΝΑ ──────────────────────────────────────────────────────────────
const texts = $('texts'), T = [];
// Είσοδος: fi δευτερόλεπτα· έξοδος: fo δευτερόλεπτα μετά το tout (διασταύρωση με το επόμενο, χωρίς κενό).
function text(cls, s, style, tin, tout, fi = 0.25, fo = 0.25) {
  const el = document.createElement('div'); el.className = 'txt ' + cls; el.textContent = s;
  Object.assign(el.style, style); texts.appendChild(el); T.push({ el, tin, tout, fi, fo }); return el;
}
const centered = (top, w, size) => ({ left: px((W - w) / 2) + 'px', top: top + 'px', width: w + 'px', fontSize: size + 'px' });
// Αγκίστρι: ολόκληρο από το καρέ 0 ως την πρώτη κοπή.
const HOOK = ['Μία φωτογραφία.', 'Όλα στη θέση τους.'];
const hookEls = HOOK.map((w, i) => text('msg', w, { ...centered(L.hookY[i] - L.hookSize / 2, 1060, L.hookSize), color: i === 1 ? 'var(--mkt-accent)' : '' }, -1, CUT[0], 0, 0));
const CAPS = [
  [CUT[0], CUT[1], 'Οι προθεσμίες έρχονται μόνες τους.'],
  [CUT[1], CUT[5], 'Μία φωτογραφία συμπληρώνει τα στοιχεία.'],
  [CUT[5], CUT[6], 'Το παραστατικό μπαίνει στον φάκελό του.'],
  [CUT[6], CUT[7], 'Ο φάκελος του λογιστή, σε ένα zip.'],
];
// Διασταύρωση στην κοπή: η παλιά σβήνει στα 0,15″ πριν, η νέα μπαίνει από τα 0,05″ πριν ως τα 0,15″ μετά.
const capEls = CAPS.map(([a, b, s]) => text('cap', s, centered(0, L.capW, L.capSize), a === CUT[0] ? a : a - 0.05, b,
  a === CUT[0] ? 0 : 0.2, b === CUT[7] ? 0 : 0.15));
const MSG = ['Κάθε ακίνητο.', 'Κάθε υποχρέωση.', 'Ένα μέρος.'];
MSG.forEach((m, i) => text('msg', m, { ...centered(L.cMsgY + i * L.cMsgGap, 1060, L.cMsgSize), color: i === 2 ? 'var(--mkt-accent)' : '' }, TL.msgClose[i], TL.dur + 1, 0.3, 0));
function vis(t, { tin, tout, fi, fo }) {
  if (tin < 0) return t < tout ? 1 : 0;
  const a = fi > 0 ? lin(t, tin, fi) : t >= tin ? 1 : 0;
  const b = fo > 0 ? 1 - lin(t, tout - fo, fo) : t < tout ? 1 : 0;
  return Math.min(a, b);
}
const badge = $('badge'), tapsEl = $('taps'), logo = $('logo'), url = $('url'), zone = $('zone'), band = $('band');
Object.assign(badge.style, { fontSize: L.badgeSize + 'px', height: L.pillH + 'px', padding: '0 24px', top: L.pillY + 'px' });
Object.assign(tapsEl.style, { fontSize: L.tapsSize + 'px', height: L.pillH + 'px', padding: '0 26px', top: L.pillY + 'px', left: '56px' });
Object.assign(logo.style, { width: L.logoW + 'px', left: (W - L.logoW) / 2 + 'px', top: L.logoY + 'px' });
Object.assign(url.style, { fontSize: L.urlSize + 'px', width: '520px', left: (W - 520) / 2 + 'px', top: L.urlY + 'px', padding: '22px 0' });
Object.assign(zone.style, { top: 0, height: L.zoneEnd + 60 + 'px',
  background: `linear-gradient(180deg, var(--mkt-bg-base) 0px, var(--mkt-bg-base) ${L.zoneEnd}px, transparent ${L.zoneEnd + 60}px)` });
Object.assign(band.style, { top: L.bandTop - 60 + 'px', height: H - L.bandTop + 60 + 'px',
  background: `linear-gradient(0deg, var(--mkt-bg-base) 0px, var(--mkt-bg-base) ${H - L.bandTop}px, transparent ${H - L.bandTop + 60}px)` });

// Προβολέας ανά πλάνο: [από, ως, κουτί, σκιά]. Ο ΕΝΦΙΑ δεν φωτίζεται ποτέ: η σάρωση είναι λογαριασμός ρεύματος.
const SPOTS = [
  [10.75, CUT[6], BOXES.power, 0.65],
  [CUT[6], TL.packUp + 0.25, BOXES.afmBlock, 1.0],   // σβήνει αφού το σκίαστρο του φύλλου γίνει αδιαφανές
];
// Πατήματα: [χρόνος, σημείο εφαρμογής].
const TAPS = [
  [TL.taps[0], [BOXES.overview.scan.x + 88, BOXES.overview.scan.y + 18]],
  [TL.taps[1], [BOXES.photo.x + 170, BOXES.photo.y + 50]],
  [TL.taps[2], [195, 470]],
  [TL.taps[3], [BOXES.save.x + 170, BOXES.save.y + 18]],
  [TL.taps[4], [BOXES.download.x + 60, BOXES.download.y + 18]],
];

// ── render(t) ────────────────────────────────────────────────────────────
const S = (el) => el.style;
const stepCount = (t, list) => list.filter((b) => t >= b).length;
window.render = function render(t) {
  const sig = [];
  Object.assign(S($('g1')), { width: '1300px', height: '1300px', left: px(-260 + 180 * Math.sin(t / 4.2)) + 'px', top: px(H * 0.2 + 120 * Math.cos(t / 5.3)) + 'px' });
  Object.assign(S($('g2')), { width: '1100px', height: '1100px', left: px(420 + 160 * Math.cos(t / 3.7)) + 'px', top: px(H * 0.55 + 110 * Math.sin(t / 4.9)) + 'px' });
  const sh = shotAt(t), on = !!sh;
  S($('rig')).display = on ? 'block' : 'none';
  for (const x of SHOTS) S($(x.id)).display = sh && sh.id === x.id ? 'block' : 'none';
  if (sh) {
    const Z = sh.s / K, fx = BEZ + 195 * K, fy = BEZ + (SB + sh.ay) * K;
    const tr = `translate(${px(W / 2 - fx * Z)}px, ${px(sh.sy - fy * Z)}px) scale(${Z.toFixed(5)})`;
    S($('rig')).transform = tr; sig.push(sh.id, tr);
  }
  // 1. Οι προθεσμίες εμφανίζονται μόνες τους, γραμμή γραμμή.
  const np = stepCount(t, TL.rowsOver);
  prows.forEach((im, i) => { im.style.visibility = i < np ? 'visible' : 'hidden'; });
  // 3. Τα πεδία γεμίζουν από τη σάρωση.
  const pi = Math.floor(lin(t, TL.fill[0], TL.fill[1] - TL.fill[0]) * PROV_N + 1e-6);
  provs.forEach((im, i) => { im.style.visibility = i === pi ? 'visible' : 'hidden'; });
  afmIm.style.visibility = t >= TL.ticks[1] - 0.05 ? 'visible' : 'hidden';
  dateIms.forEach((im) => { im.style.visibility = t >= TL.dates ? 'visible' : 'hidden'; });
  amountIm.style.visibility = t >= TL.ticks[2] - 0.05 ? 'visible' : 'hidden';
  TL.ticks.forEach((b, k) => {
    const u = lin(t, b, 0.18), el = $('t' + (k + 1));
    el.style.display = u > 0 && sh && sh.id === 'S_form' ? 'block' : 'none';
    el.style.opacity = u.toFixed(3); el.style.transform = `scale(${(0.6 + 0.4 * u).toFixed(3)})`;
  });
  sig.push(np, pi, t >= TL.dates);
  // 4. Ο φάκελος «Ρεύμα»: 1 → 2 αρχεία τη στιγμή που φτάνει το παραστατικό (δύο λήψεις της εφαρμογής).
  const fu = lin(t, TL.filed, 0.06);
  S($('docsAfter')).opacity = fu.toFixed(3);
  // 5. «Κατέβασε» → «Ετοιμάζεται». Μετά ανεβαίνει το πακέτο, πάνω σε πλήρως αδιαφανές σκίαστρο.
  const busy = t >= TL.taps[4] + 0.06;
  S($('acc')).visibility = busy ? 'hidden' : 'visible'; S($('accBusy')).visibility = busy ? 'visible' : 'hidden';
  const pk = ease(lin(t, TL.packUp, 0.35));
  S(pack).display = pk > 0 ? 'block' : 'none';
  S($('dimAcc')).opacity = lin(t, TL.packUp, 0.08).toFixed(3);   // πλήρως αδιαφανές πριν ανέβει το φύλλο: κανένα φάντασμα
  S(pack).transform = `translateY(${px((1 - pk) * (PACK_BOX.h + 20) * K)}px)`;
  packRows.forEach((r, i) => { r.style.opacity = lin(t, TL.rowsPack[i], 0.15).toFixed(3); });
  sig.push(fu.toFixed(3), busy, pk.toFixed(4), stepCount(t, TL.rowsPack));
  // Προβολέας.
  let sp = null, so = 0, dim = 0;
  for (const [a, b, r, d] of SPOTS) if (t >= a && t < b) { sp = r; dim = d; so = Math.min(CUT.includes(a) ? 1 : lin(t, a, 0.2), 1 - lin(t, b - 0.15, 0.15)); }
  const spot = $('spot');
  Object.assign(S(spot), { display: sp && so > 0 ? 'block' : 'none', opacity: so.toFixed(3) });
  if (sp) {
    // Παλμός του περιγράμματος τη στιγμή που αλλάζει ο μετρητής του φακέλου.
    const pulse = sp === BOXES.power ? Math.sin(Math.PI * lin(t, TL.filed, 0.35)) : 0;
    const g = 4 + 3 * pulse;
    Object.assign(S(spot), { left: (sp.x - g) * K + 'px', top: (sp.y - g) * K + 'px', width: (sp.w + 2 * g) * K + 'px', height: (sp.h + 2 * g) * K + 'px',
      boxShadow: `0 0 0 3000px color-mix(in srgb, var(--mkt-bg-base) ${Math.round(dim * 100)}%, transparent)` });
    sig.push(pulse.toFixed(3));
  }
  sig.push(so.toFixed(3));
  // Δάχτυλο.
  let fxy = null, press = 0, ring = -1;
  for (const [b, p] of TAPS) {
    const d = t - b;
    if (d > -0.18 && d < 0.12) { fxy = p; press = d < 0 ? clamp((d + 0.18) / 0.12, 0, 1) : clamp(1 - d / 0.12, 0, 1); }
    if (d >= 0 && d < 0.45) { ring = d / 0.45; fxy = fxy || p; }
  }
  // Το δάχτυλο φαίνεται μόνο μέσα στο πλάνο του πατήματος.
  if (!sh) fxy = null;
  const tr = $('touch'), rg = $('touchRing');
  if (fxy && press > 0.01) {
    const r = 22 * K * (1.12 - 0.12 * press);
    Object.assign(tr.style, { display: 'block', left: (fxy[0] * K - r).toFixed(1) + 'px', top: (fxy[1] * K - r).toFixed(1) + 'px', width: 2 * r + 'px', height: 2 * r + 'px', opacity: (0.95 * press).toFixed(3) });
    sig.push(press.toFixed(3));
  } else tr.style.display = 'none';
  if (fxy && ring >= 0) {
    const r = 22 * K * (1 + 1.1 * ease(ring));
    Object.assign(rg.style, { display: 'block', left: (fxy[0] * K - r).toFixed(1) + 'px', top: (fxy[1] * K - r).toFixed(1) + 'px', width: 2 * r + 'px', height: 2 * r + 'px', opacity: (0.8 * (1 - ring)).toFixed(3) });
    sig.push(ring.toFixed(3));
  } else rg.style.display = 'none';
  // Το κλείστρο βυθίζεται στο πάτημα.
  const sd = Math.max(0, 1 - Math.abs(t - TL.taps[2]) / 0.12);
  S($('shutter')).transform = `scale(${(1 - 0.08 * sd).toFixed(4)})`;

  // Κείμενα. Η λεζάντα κεντράρεται κάθετα στη ζώνη της.
  for (const e of T) {
    const o = vis(t, e);
    e.el.style.display = o > 0 ? 'block' : 'none'; e.el.style.opacity = o.toFixed(3); sig.push(o.toFixed(3));
  }
  for (const el of capEls) if (el.style.display === 'block') el.style.top = px(L.capMid - el.offsetHeight / 2) + 'px';
  // Το αγκίστρι: πλήρες από το καρέ 0, με αργό πλησίασμα 3%.
  const hz = 1 + 0.03 * lin(t, 0, CUT[0]);
  hookEls.forEach((el) => { el.style.transform = `scale(${hz.toFixed(4)})`; });
  sig.push(hz.toFixed(4));
  // Πατήματα: ο μετρητής αλλάζει τη στιγμή κάθε πατήματος, με παλμό.
  const nTaps = stepCount(t, TL.taps);
  $('tapN').textContent = String(nTaps);
  const lastTap = nTaps ? TL.taps[nTaps - 1] : -9, pu = lin(t, lastTap, 0.35);
  const pillsOn = on ? 1 : 0;
  Object.assign(tapsEl.style, { opacity: pillsOn, display: pillsOn ? 'flex' : 'none',
    transform: pu < 1 ? `scale(${(1 + 0.22 * Math.sin(Math.PI * pu)).toFixed(4)})` : 'none',
    boxShadow: pu < 1 ? `0 0 0 ${(10 * Math.sin(Math.PI * pu)).toFixed(1)}px color-mix(in srgb, var(--mkt-accent) 30%, transparent)` : 'none' });
  sig.push(nTaps, pu.toFixed(3));
  S(zone).display = on ? 'block' : 'none'; S(band).display = on ? 'block' : 'none';
  S(badge).display = pillsOn ? 'flex' : 'none';
  S(badge).left = px(W - 56 - badge.offsetWidth) + 'px';
  // Κλείσιμο: το λογότυπο ολόκληρο, από το κέντρο· μετά το μήνυμα και η διεύθυνση.
  const co = ease(lin(t, TL.close, 0.45));
  S(logo).display = co > 0 ? 'block' : 'none'; S(logo).opacity = co.toFixed(3);
  S(logo).transform = co < 1 ? `scale(${(0.9 + 0.1 * co).toFixed(4)})` : 'none';
  const uo = lin(t, TL.url, 0.3);
  S(url).opacity = uo.toFixed(3); S(url).display = uo > 0 ? 'block' : 'none';
  sig.push(co.toFixed(4), uo.toFixed(3));
  return sig.join('|');
};
window.ready = async () => {
  await Promise.all([...document.images].map((im) => im.decode()));
  await document.fonts.load('700 50px Inter', 'ΑΒΓαβγ€0123'); await document.fonts.ready;
  // Το όνομα του zip σε μία γραμμή: αν δεν χωρά, μικραίνει.
  let fs = 15 * K;
  S(pack).display = 'block';
  while (titleEl.scrollWidth > 350 * K && fs > 10 * K) { fs -= 0.5; titleEl.style.fontSize = fs + 'px'; }
  window.render(0); await document.fonts.ready;
  return true;
};
window.TL = TL;
})();
