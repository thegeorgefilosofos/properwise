<!-- Τα χρώματα και η Inter έρχονται από το ίδιο το app/globals.css (render.mjs το σερβίρει ως /globals.css, με το public/ ως ρίζα). -->
<link rel="stylesheet" href="/globals.css">
<style>
  *, *::before, *::after { transition: none !important; animation: none !important; }
  html, body { margin: 0; padding: 0; overflow: hidden; background: var(--mkt-bg-base); }
  #stage { position: absolute; left: 0; top: 0; overflow: hidden; font-family: 'Inter', sans-serif; color: var(--mkt-text-primary);
    font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; background: linear-gradient(180deg, var(--mkt-space-top), var(--mkt-space-mid) 55%, var(--mkt-space-bottom)); }
  #shape { position: absolute; background: var(--mkt-bg-elevated); overflow: hidden; }
  #shape .layer { position: absolute; inset: 0; border-radius: inherit; }
  #fillAccent { background: var(--mkt-accent); }
  #ringAccent { border: 3px solid var(--mkt-accent); }
  #ringStrong { border: 2px solid var(--mkt-border-strong); }
  #ringSoft { border: 2px solid var(--mkt-border-default); }
  #screen { position: absolute; overflow: hidden; background: var(--mkt-bg-base); }
  #screen img { position: absolute; left: 0; top: 0; visibility: hidden; max-width: none; }
  #dim { position: absolute; inset: 0; background: var(--mkt-bg-base); }
  #focus { position: absolute; border: 3px solid var(--mkt-accent); border-radius: 14px; }
  #card { position: absolute; overflow: hidden; border: 2px solid var(--mkt-accent); background: var(--mkt-bg-surface);
    box-shadow: 0 28px 90px color-mix(in srgb, var(--mkt-bg-base) 80%, transparent); }
  #card img { position: absolute; left: 0; top: 0; width: 100%; height: 100%; visibility: hidden; max-width: none; }
  .txt { position: absolute; text-align: center; white-space: normal; text-wrap: balance; }
  .date { font-weight: 750; letter-spacing: -0.02em; line-height: 1; }
  .line { font-weight: 620; line-height: 1.2; }
  .cap { font-weight: 680; line-height: 1.14; letter-spacing: -0.01em; }
  .eyebrow { font-weight: 700; letter-spacing: .16em; color: var(--mkt-accent); }

  #badge { position: absolute; color: var(--mkt-text-secondary); background: var(--mkt-bg-surface); border: 1.5px solid var(--mkt-border-default);
    border-radius: 999px; font-weight: 600; white-space: nowrap; }
  #cursor { position: absolute; left: 0; top: 0; }
  #cursor svg { display: block; }
  #cursor .arrow path { fill: var(--mkt-text-primary); stroke: var(--mkt-bg-base); stroke-width: 2.2; stroke-linejoin: round; }
  #who { position: absolute; background: var(--mkt-bg-elevated); color: var(--mkt-text-primary); border: 1.5px solid var(--mkt-border-strong);
    border-radius: 999px; font-weight: 650; white-space: nowrap; }
  #ripple { position: absolute; border: 3px solid var(--mkt-accent); border-radius: 50%; }
</style>

<div id="stage">

</div>

<!-- ΤΟ ΧΡΟΝΟΛΟΓΙΟ, ΜΙΑ ΠΗΓΗ. Το διαβάζουν η ταινία, ο ήχος (sound.ts) και η λήψη (capture.mjs, για τα κοντινά). Χρόνοι σε χτύπους.
     «crops»: τα τέσσερα κοντινά, σε px εφαρμογής (390×844) πάνω στη λήψη της Επισκόπησης, της Σάρωσης, της Λογιστικής. -->
<script id="timeline" type="application/json">
{
  "bpm": 120, "beats": 58, "fps": 30, "cover": 2.2,
  "dips": [6, 7.5, 12.5, 14, 15, 20.5, 22, 23, 28.5, 30, 31, 38, 44],
  "lifts": [7.5, 15, 23, 31],
  "taps": [14, 22, 30, 34],
  "entries": [0, 1, 2, 6, 14, 22, 30, 38, 44, 44.5, 45, 46],
  "bells": [0, 38, 44],
  "reveal": 6,
  "chords": [[0, ["A2", "E3", "A3", "C4", "E4"]], [6, ["F2", "C3", "F3", "A3", "C4"]], [14, ["C3", "G3", "C4", "E4", "G4"]], [22, ["G2", "D3", "G3", "B3", "D4"]], [30, ["A2", "E3", "A3", "C4", "E4"]], [38, ["F2", "C3", "F3", "A3", "C4"]], [44, ["C3", "G3", "C4", "E4", "G4"]], [50, ["F2", "C3", "F3", "A3", "E4"]]],
  "crops": {
    "portfolio": { "shot": "portfolio", "x": 16, "y": 240, "w": 358, "h": 270 },
    "deadlines": { "shot": "overview", "x": 16, "y": 264, "w": 358, "h": 214 },
    "fields": { "shot": "scan", "x": 16, "y": 528, "w": 358, "h": 184 },
    "dossier": { "shot": "accountant", "x": 26, "y": 284, "w": 338, "h": 284 },
    "dossierBusy": { "shot": "accountantBusy", "x": 26, "y": 284, "w": 338, "h": 284 }
  }
}
</script>
<script>
(() => {
const TL = JSON.parse(document.getElementById('timeline').textContent);
const BEAT = 60 / TL.bpm, FPS = TL.fps, HALF = 4 / FPS;
const B = (b) => b * BEAT;
const fmt = new URLSearchParams(location.search).get('f') === '45' ? '45' : '916';
const W = 1080, H = fmt === '45' ? 1350 : 1920;

// ── Ο ΤΟΠΟΣ ΤΗΣ ΚΑΘΕ ΜΟΡΦΗΣ ──────────────────────────────────────────────
// 9:16: ό,τι διαβάζεται μένει στο y 250 έως 1536. Το τηλέφωνο είναι 1.000 px,
// το 78% του ύψους της ζώνης· η λεζάντα πάνω του. Τα κοντινά: 960 px πλάτος.
const L = fmt === '916' ? {
  phone: { x: 302, y: 528, w: 476, h: 1000, r: 66, bez: 12 },
  capTop: 268, capW: 980, capSize: 76, eyebrowTop: 254, cardW: 960, cardCy: 1010, msgTop: 600, msgSize: 104, msgGap: 132, brandY: 452, brandSz: 64, urlY: 1170,
  hookPill: { cx: 540, cy: 780, w: 940, h: 220 }, dateSize: 136, hookLineTop: 960, lineSize: 58, lineW: 860,
  card: { cx: 540, cy: 840, w: 880, h: 400 }, numSize: 176, eyebrow16Top: 700, label16Top: 1090,
  bar: { cx: 540, cy: 1040, w: 160, h: 10 }, condTop: 820, condSize: 64,
  footTop: 1440, footSize: 26,
  brandTop: 720, brandSize: 104, brandLineTop: 880, urlPill: { cx: 540, cy: 1170, w: 540, h: 124 }, urlSize: 48,
  badgeSize: 24, cursorScale: 1.15,
} : {
  phone: { x: 288, y: 222, w: 504, h: 1100, r: 68, bez: 12 },
  capTop: 50, capW: 1040, capSize: 60, eyebrowTop: 18, cardW: 960, cardCy: 772, msgTop: 420, msgSize: 96, msgGap: 122, brandY: 250, brandSz: 58, urlY: 930,
  hookPill: { cx: 540, cy: 560, w: 900, h: 210 }, dateSize: 128, hookLineTop: 720, lineSize: 54, lineW: 860,
  card: { cx: 540, cy: 600, w: 860, h: 380 }, numSize: 164, eyebrow16Top: 470, label16Top: 840,
  bar: { cx: 540, cy: 840, w: 160, h: 10 }, condTop: 580, condSize: 60,
  footTop: 1220, footSize: 24,
  brandTop: 470, brandSize: 96, brandLineTop: 620, urlPill: { cx: 540, cy: 930, w: 520, h: 116 }, urlSize: 46,
  badgeSize: 22, cursorScale: 1.05,
};
const P = L.phone;
const SCR = { x: P.x + P.bez, y: P.y + P.bez, w: P.w - 2 * P.bez, h: P.h - 2 * P.bez, r: P.r - P.bez };
const APP_W = 390, K = SCR.w / APP_W;     // px κάδρου ανά px εφαρμογής, για ολόκληρο το τηλέφωνο

const stage = document.getElementById('stage');
stage.style.width = W + 'px'; stage.style.height = H + 'px';
const $ = (id) => document.getElementById(id);
const px = Math.round;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

// ── Ελατήρια (kinisi/references/texniki.md) ─────────────────────────────
function stepR(tau, { w, z }) {
  if (tau <= 0) return 0;
  if (z >= 1) { const x = w * tau; return 1 - Math.exp(-x) * (1 + x); }
  const wd = w * Math.sqrt(1 - z * z);
  return 1 - Math.exp(-z * w * tau) * (Math.cos(wd * tau) + (z * w / wd) * Math.sin(wd * tau));
}
class Track {
  constructor(v0) { this.v0 = v0; this.cur = v0; this.ev = []; }
  to(t, v, sp) { if (v !== this.cur) { this.ev.push([t, v - this.cur, sp]); this.cur = v; } return this; }
  at(t) { let v = this.v0; for (const [ti, d, sp] of this.ev) v += d * stepR(t - ti, sp); return v; }
  // Μετά από 8 καρέ από κάθε αλλαγή η τιμή είναι ΑΚΡΙΒΩΣ ο στόχος: καμία ουρά κάτω από κείμενο.
  snap(t) {
    const active = this.ev.filter(([ti]) => ti <= t);
    if (active.some(([ti]) => t < ti + 2 * HALF)) return this.at(t);
    return active.reduce((v, [, d]) => v + d, this.v0);
  }
}
function dipAt(t, list = TL.dips) {
  let o = 1;
  for (const b of list) { const d = Math.abs(t - B(b)); if (d < HALF) o = Math.min(o, d / HALF); }
  return o;
}
function vis(t, tin, tout) {
  if (t < tin || t >= tout) return 0;
  return clamp(Math.min((t - tin) / HALF, (tout - t) / HALF), 0, 1);
}

// ── ΤΟ ΣΧΗΜΑ ─────────────────────────────────────────────────────────────
const rectOf = (c) => ({ x: c.cx - c.w / 2, y: c.cy - c.h / 2, w: c.w, h: c.h, r: Math.min(c.h / 2, c.r ?? c.h / 2) });
const SH = {
  hook: { ...rectOf(L.hookPill), accent: 1, strong: 0, soft: 0, fill: 0 },
  card: { ...rectOf({ ...L.card, r: 48 }), accent: 0, strong: 0, soft: 1, fill: 0 },
  bar: { ...rectOf(L.bar), accent: 0, strong: 0, soft: 0, fill: 1 },
  phone: { x: P.x, y: P.y, w: P.w, h: P.h, r: P.r, accent: 0, strong: 1, soft: 0, fill: 0 },
  url: { ...rectOf(L.urlPill), accent: 1, strong: 0, soft: 0, fill: 0 },
};
const SHAPE_AT = [[0, 'bar'], [6, 'phone'], [38, 'hook'], [44, 'url']];
const geo = {}, SP_SHAPE = { w: 15, z: .84 }, SP_FADE = { w: 40, z: 1 };
for (const k of ['x', 'y', 'w', 'h', 'r']) geo[k] = new Track(SH.bar[k]);
for (const k of ['accent', 'strong', 'soft', 'fill']) geo[k] = new Track(SH.bar[k]);
for (const [b, name] of SHAPE_AT.slice(1)) {
  // Η μεταμόρφωση ξεκινά στην αρχή της βύθισης· στο κλείσιμο, αφού σβήσει η οθόνη.
  const s = SH[name], t0 = b === 38 ? B(b) : B(b) - HALF;
  for (const k of ['x', 'y', 'w', 'h', 'r']) geo[k].to(t0, s[k], SP_SHAPE);
  for (const k of ['accent', 'strong', 'soft', 'fill']) geo[k].to(t0, s[k], SP_FADE);
}

// ── ΟΙ ΤΕΣΣΕΡΙΣ ΣΤΙΓΜΕΣ ──────────────────────────────────────────────────
// Κάθε στιγμή: ολόκληρο το τηλέφωνο με πλαίσιο στο component (1,5 χτύπος),
// μετά το component ΣΗΚΩΝΕΤΑΙ από την οθόνη και μεγαλώνει στα 960 px, από
// δική του λήψη ×9 (όχι μεγέθυνση της λήψης της οθόνης). Γυρίζει στη θέση του
// πριν από το πάτημα που φέρνει την επόμενη στιγμή.
const MOMENTS = [
  { T: 6, shot: 'portfolio', crop: 'portfolio', lift: 7.5, drop: 12.5 },
  { T: 14, shot: 'overview', crop: 'deadlines', lift: 15, drop: 20.5 },
  { T: 22, shot: 'scan', crop: 'fields', lift: 23, drop: 28.5 },
  { T: 30, shot: 'accountant', crop: 'dossier', lift: 31, drop: 38 },
];
const SWAP = { b: 34, shot: 'accountantBusy', crop: 'dossierBusy' };   // το «Κατέβασε» γίνεται «Ετοιμάζεται» με το πάτημα
const momentAt = (t) => { let m = null; for (const x of MOMENTS) if (t >= B(x.T)) m = x; return m; };
function shotAt(t) {
  const m = momentAt(t);
  if (!m) return 'portfolio';
  return m.crop === 'dossier' && t >= B(SWAP.b) ? SWAP.shot : m.shot;
}
function cropAt(t) {
  const m = momentAt(t);
  if (!m) return null;
  return m.crop === 'dossier' && t >= B(SWAP.b) ? SWAP.crop : m.crop;
}
const CROPS = TL.crops;
// Πού κάθεται το κοντινό όταν είναι σηκωμένο: 960 px πλάτος, στο κέντρο του τηλεφώνου.
function cardDst(name) {
  const c = CROPS[name], w = L.cardW, h = w * c.h / c.w;
  return { x: (W - w) / 2, y: L.cardCy - h / 2, w, h };
}
const cardSrc = (name) => { const c = CROPS[name]; return { x: SCR.x + c.x * K, y: SCR.y + c.y * K, w: c.w * K, h: c.h * K }; };
const lift = new Track(0), SP_LIFT = { w: 30, z: 1 };
for (const m of MOMENTS) { lift.to(B(m.lift) - HALF, 1, SP_LIFT); lift.to(B(m.drop) - HALF, 0, SP_LIFT); }
function cardRect(t) {
  const m = momentAt(t);
  if (!m) return null;
  const k = clamp(lift.snap(t), 0, 1.05);
  if (k <= 0.0005) return null;
  const s = cardSrc(m.crop), d = cardDst(m.crop);
  return { x: s.x + (d.x - s.x) * k, y: s.y + (d.y - s.y) * k, w: s.w + (d.w - s.w) * k, h: s.h + (d.h - s.h) * k, k, crop: cropAt(t) };
}
// Από px εφαρμογής σε px κάδρου: στο σηκωμένο κοντινό αν υπάρχει, αλλιώς στην οθόνη.
function cardPoint(name, ax, ay) { const c = CROPS[name], d = cardDst(name); return { x: d.x + (ax - c.x) * d.w / c.w, y: d.y + (ay - c.y) * d.h / c.h }; }
const appPoint = (ax, ay) => ({ x: SCR.x + ax * K, y: SCR.y + ay * K });

// ── ΤΑ ΚΕΙΜΕΝΑ ───────────────────────────────────────────────────────────
const textsEl = $('texts');
const T = [];
function text(cls, html, style, tin, tout) {
  const el = document.createElement('div');
  el.className = 'txt ' + cls; el.innerHTML = html;
  Object.assign(el.style, style);
  textsEl.appendChild(el);
  T.push({ el, tin: B(tin), tout: B(tout) });
  return el;
}
const centered = (top, w, size) => ({ left: px((W - w) / 2) + 'px', top: top + 'px', width: w + 'px', fontSize: size + 'px' });
const END = TL.beats + 1;
const dateTop = (pill, size) => px(pill.cy - size * 0.5);
// ΕΝΑ μήνυμα: στα 2 πρώτα δευτερόλεπτα και στο κλείσιμο.
const MSG = ['Κάθε ακίνητο.', 'Κάθε υποχρέωση.', 'Ένα μέρος.'];
const msg = (tins, tout) => MSG.forEach((m, i) => text('date', m, { ...centered(L.msgTop + i * L.msgGap, 1040, L.msgSize), color: i === 2 ? 'var(--mkt-accent)' : '' }, tins[i], tout));
msg([-1, 1, 2], 6);
const CAPS = [
  [6, 14, 'Όλα τα ακίνητα. Μία ματιά.'],
  [14, 22, 'Κάθε προθεσμία, μετρημένη.'],
  [22, 30, 'Σάρωσε. Συμπληρώνεται μόνο του.'],
  [30, 38, 'Ο λογιστής, με ένα πάτημα.'],
];
for (const [a, b, s] of CAPS) text('cap', s, centered(L.capTop, L.capW, L.capSize), a, b);
// Μία γρήγορη κάρτα: η προθεσμία της ανακαίνισης (RENO_39B_TO).
text('date', '31/12/2026', centered(dateTop(L.hookPill, L.dateSize), 900, L.dateSize), 38, 44);
text('line', 'Τελευταία μέρα για έκπτωση ανακαίνισης', centered(L.hookLineTop, L.lineW, L.lineSize), 38.5, 44);
text('foot', 'Άρθρο 39Β ΚΦΕ · δαπάνες 01/01/2024 έως 31/12/2026', centered(L.footTop, 900, L.footSize), 38.5, 44);
// Κλείσιμο: το ίδιο μήνυμα, η μάρκα, η διεύθυνση.
text('', 'PROPERWISE', { ...centered(L.brandY, 1000, L.brandSz), fontWeight: 800, letterSpacing: '.06em', lineHeight: 1 }, 44, END);
msg([44, 44.5, 45], END);
text('', 'properwise.gr', { ...centered(px(L.urlPill.cy - L.urlSize * 0.62), 600, L.urlSize), color: 'var(--mkt-accent)', fontWeight: 650 }, 46, END);

// ── Ο ΔΡΟΜΕΑΣ ────────────────────────────────────────────────────────────
// [χτύπος άφιξης, πού: «off» σε px κάδρου, «app» σε px εφαρμογής στην οθόνη, ή όνομα κοντινού σε px εφαρμογής]
const CUR = [
  [5.4, 'off', W + 60, H * 0.7],
  [9.0, 'portfolio', 300, 300],         // δίπλα στο καθαρό του έτους, στο κοντινό
  [11.0, 'portfolio', 330, 470],        // οι ανεξόφλητες
  [13.4, 'app', 300, 562],              // «Ακίνητο 1»
  [16.4, 'deadlines', 250, 300],        // δίπλα στο «7 ημέρες ακόμη»
  [18.6, 'deadlines', 362, 296],
  [21.4, 'app', 104, 224],              // «Σάρωσε έγγραφο»
  [24.4, 'fields', 230, 604],           // ο πάροχος, διαβασμένος
  [26.6, 'fields', 160, 682],           // ο ΑΦΜ του παρόχου
  [29.4, 'app', 195, 812],              // «Καταχώρηση»
  [33.2, 'dossier', 120, 545],          // «Κατέβασε», στο κοντινό
  [35.8, 'dossier', 300, 470],
  [37.8, 'off', W + 60, H * 0.62],
];
const SP_CUR = { w: 8.5, z: .86 };
const curX = new Track(CUR[0][2]), curY = new Track(CUR[0][3]);
for (const [b, kind, x, y] of CUR.slice(1)) {
  const t0 = B(b) - 0.3;          // στόχος που πρέπει να ΦΤΑΣΕΙ στο Τ δίνεται 0,3″ νωρίτερα
  const p = kind === 'off' ? { x, y } : kind === 'app' ? appPoint(x, y) : cardPoint(kind, x, y);
  curX.to(t0, p.x, SP_CUR); curY.to(t0, p.y, SP_CUR);
}

// ── render(t): κάθε στυλ από τον χρόνο, τίποτα από το προηγούμενο καρέ ────
const imgs = {}; document.querySelectorAll('#screen img').forEach((im) => { imgs[im.dataset.shot] = im; });
const crops = {}; document.querySelectorAll('#card img').forEach((im) => { crops[im.dataset.crop] = im; });
const shapeEl = $('shape'), screenEl = $('screen'), focusEl = $('focus'), dimEl = $('dim'), cardEl = $('card');
const badge = $('badge'), cursor = $('cursor'), who = $('who'), ripple = $('ripple');
badge.style.fontSize = L.badgeSize + 'px'; badge.style.padding = `${px(L.badgeSize * .36)}px ${px(L.badgeSize * .7)}px`;
who.style.fontSize = px(22 * L.cursorScale) + 'px'; who.style.padding = '4px 12px';
Object.assign(screenEl.style, { left: SCR.x + 'px', top: SCR.y + 'px', width: SCR.w + 'px', height: SCR.h + 'px', borderRadius: SCR.r + 'px' });
for (const k in imgs) Object.assign(imgs[k].style, { width: px(SCR.w) + 'px', height: px(SCR.w * 844 / 390) + 'px' });

window.render = function render(t) {
  const sig = [];
  const set = (el, prop, v) => { el.style[prop] = v; sig.push(v); };
  // Σχήμα.
  const g = {}; for (const k in geo) g[k] = geo[k].at(t);
  set(shapeEl, 'left', px(g.x) + 'px'); set(shapeEl, 'top', px(g.y) + 'px');
  set(shapeEl, 'width', px(g.w) + 'px'); set(shapeEl, 'height', px(g.h) + 'px');
  set(shapeEl, 'borderRadius', px(clamp(g.r, 2, Math.min(g.w, g.h) / 2)) + 'px');
  for (const [id, v] of [['ringAccent', g.accent], ['ringStrong', g.strong], ['ringSoft', g.soft], ['fillAccent', g.fill]]) set($(id), 'opacity', clamp(v, 0, 1).toFixed(3));

  // Οθόνη: μπαίνει όταν κάτσει το τηλέφωνο, φεύγει πριν αλλάξει σχήμα.
  const scrIn = clamp((t - (B(TL.reveal) + 0.30)) / 0.22, 0, 1), scrOut = clamp((B(38) - t) / HALF, 0, 1);
  const on = Math.min(scrIn, scrOut);
  const d = dipAt(t);
  const so = on * (0.22 + 0.78 * d);
  const blur = (1 - d) * 5 + (1 - on) * 4;
  set(screenEl, 'opacity', so.toFixed(3)); set(screenEl, 'filter', blur > 0.01 ? `blur(${blur.toFixed(2)}px)` : 'none');
  const name = shotAt(t);
  for (const k in imgs) imgs[k].style.visibility = k === name ? 'visible' : 'hidden';
  sig.push(name);
  // Πλαίσιο στο component, όσο το τηλέφωνο φαίνεται ολόκληρο πριν από το σήκωμα.
  const m = momentAt(t);
  const fo = m && t >= B(m.T) && t < B(m.lift) ? 1 : 0;
  set(focusEl, 'opacity', String(fo));
  if (m) { const c = CROPS[m.crop]; set(focusEl, 'left', px(c.x * K - 4) + 'px'); set(focusEl, 'top', px(c.y * K - 4) + 'px'); set(focusEl, 'width', px(c.w * K + 8) + 'px'); set(focusEl, 'height', px(c.h * K + 8) + 'px'); }
  // Κοντινό.
  const cr = cardRect(t);
  set(dimEl, 'opacity', (cr ? 0.62 * clamp(cr.k, 0, 1) : 0).toFixed(3));
  if (cr && on > 0) {
    set(cardEl, 'display', 'block');
    set(cardEl, 'left', px(cr.x) + 'px'); set(cardEl, 'top', px(cr.y) + 'px');
    set(cardEl, 'width', px(cr.w) + 'px'); set(cardEl, 'height', px(cr.h) + 'px');
    set(cardEl, 'borderRadius', px(10 + 18 * clamp(cr.k, 0, 1)) + 'px');
    const cb = (1 - d) * 5;
    set(cardEl, 'filter', cb > 0.01 ? `blur(${cb.toFixed(2)}px)` : 'none');
    set(cardEl, 'opacity', Math.min(on, 0.3 + 0.7 * d).toFixed(3));
    for (const k in crops) crops[k].style.visibility = k === cr.crop ? 'visible' : 'hidden';
    sig.push(cr.crop);
  } else set(cardEl, 'display', 'none');

  // Ετικέτα επίδειξης: σε κάθε καρέ με οθόνη της εφαρμογής.
  set(badge, 'opacity', on.toFixed(3));
  const bw = badge.offsetWidth, bh = badge.offsetHeight;
  if (fmt === '916') { badge.style.left = px(P.x + P.w - bw) + 'px'; badge.style.top = px(P.y - bh - 14) + 'px'; }
  else { badge.style.left = px(P.x + P.w + 18) + 'px'; badge.style.top = px(P.y + 18) + 'px'; }

  // Κείμενα.
  for (const { el, tin, tout } of T) {
    const o = tin < 0 && t < tout ? clamp((tout - t) / HALF, 0, 1) : vis(t, tin, tout);
    el.style.display = o > 0 ? 'block' : 'none';
    el.style.opacity = o.toFixed(3);
    el.style.filter = o < 1 ? `blur(${((1 - o) * 6).toFixed(2)}px)` : 'none';
    sig.push(o.toFixed(3));
  }
  // Δρομέας.
  const cv = t > B(5.5) && t < B(38.2);
  set(cursor, 'display', cv ? 'block' : 'none');
  if (cv) {
    const x = curX.at(t), y = curY.at(t);
    const vx = (curX.at(t + 1 / 240) - curX.at(t - 1 / 240)) * 120;
    let press = 0;
    for (const b of TL.taps) press = Math.max(press, Math.exp(-Math.pow((t - B(b)) / 0.045, 2)));
    const sc = (1 - 0.16 * press) * L.cursorScale;
    const tilt = clamp(-vx * 0.0045, -14, 14);
    set(cursor, 'transform', `translate(${px(x - 4)}px, ${px(y - 3)}px) rotate(${tilt.toFixed(1)}deg) scale(${sc.toFixed(3)})`);
    cursor.style.transformOrigin = '4px 3px';
    set(who, 'left', px(30 - clamp(vx * 0.012, -18, 18)) + 'px'); who.style.top = '44px';
    let rp = -1;
    for (const b of TL.taps) { const dt = t - B(b); if (dt >= 0 && dt < 0.4) rp = dt / 0.4; }
    if (rp >= 0) {
      const r = px(14 + 46 * rp);
      Object.assign(ripple.style, { display: 'block', left: px(x - r) + 'px', top: px(y - r) + 'px', width: 2 * r + 'px', height: 2 * r + 'px', opacity: (1 - rp).toFixed(3) });
      sig.push(r);
    } else ripple.style.display = 'none';
  } else ripple.style.display = 'none';
  return sig.join('|');
};

window.ready = async () => {
  await Promise.all([...document.images].map((im) => im.decode()));
  await document.fonts.load('700 50px Inter', 'ΑΒΓαβγ€0123'); await document.fonts.ready;
  window.render(0); await document.fonts.ready;
  return true;
};
window.TL = TL;
})();
</script>
