<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<title>Σύνδεση με την ΑΑΔΕ</title>
<!-- v2 studio, καθαρό (εντολή ιδιοκτήτη): ένα μήνυμα και ένα σημείο εστίασης ανά πλάνο· laptop και κινητό μαζί σε ΜΙΑ σκηνή, χωρίς κλίση·
     κοινός άξονας x 96 και ίσα περιθώρια 96 px για λεζάντες, συσκευές και κοντινά· κινητό αγκίστρι, τυπογραφία σε αυστηρό πλέγμα (αριστερή στοίχιση στο x 96),
     ένα χρώμα έμφασης (--mkt-accent). Χρώματα και Inter από το app/globals.css (render.mjs: /globals.css, /fonts, /brand).
     Πλαίσια συσκευών σε CSS, χωρίς μάρκα. Η κάμερα κινείται μόνο μέσα σε βύθιση (kinisi): το περιεχόμενο των οθονών σβήνει
     στο 25% όσο κινούνται οι συσκευές και επιστρέφει όταν σταθούν. -->
<link rel="stylesheet" href="/globals.css">
<style>
  *, *::before, *::after { transition: none !important; animation: none !important; box-sizing: border-box; }
  html, body { margin: 0; padding: 0; overflow: hidden; background: var(--mkt-bg-base); }
  #stage { position: absolute; left: 0; top: 0; overflow: hidden; font-family: 'Inter', sans-serif; color: var(--mkt-text-primary);
    font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; background: var(--mkt-bg-base); }
  .glow { position: absolute; border-radius: 50%; background: radial-gradient(circle, color-mix(in srgb, var(--mkt-accent) 13%, transparent), transparent 66%); }
  #world { position: absolute; inset: 0; perspective: 2400px; perspective-origin: 50% 45%; }
  .dev { position: absolute; left: 0; top: 0; transform-style: preserve-3d; transform-origin: 50% 50%; }
  /* Laptop: καπάκι με λεπτό πλαίσιο, κάμερα, βάση με εγκοπή. */
  #lap .lid { position: absolute; left: 0; top: 0; border-radius: 26px; background: var(--mkt-bg-elevated);
    border: 2px solid var(--mkt-border-strong); box-shadow: 0 70px 140px color-mix(in srgb, var(--mkt-bg-base) 92%, transparent); }
  #lap .cam { position: absolute; width: 8px; height: 8px; border-radius: 50%; background: var(--mkt-border-strong); }
  #lap .screen { position: absolute; overflow: hidden; border-radius: 8px; background: var(--mkt-bg-base); }
  #lap .base { position: absolute; border-radius: 4px 4px 22px 22px; background: var(--mkt-bg-elevated); border: 2px solid var(--mkt-border-strong); border-top: 0; }
  #lap .notch { position: absolute; border-radius: 0 0 10px 10px; background: var(--mkt-border-strong); }
  /* Κινητό: σώμα, οθόνη, νησίδα. */
  #phone .body { position: absolute; inset: 0; background: var(--mkt-bg-elevated); border: 2px solid var(--mkt-border-strong);
    box-shadow: 0 70px 140px color-mix(in srgb, var(--mkt-bg-base) 92%, transparent); }
  #phone .screen { position: absolute; overflow: hidden; background: var(--mkt-bg-base); }
  #phone .island { position: absolute; background: var(--mkt-bg-base); border-radius: 999px; }
  .screen img, #panel img { position: absolute; left: 0; top: 0; max-width: none; }
  .glass { position: absolute; inset: 0; pointer-events: none; background: linear-gradient(118deg, color-mix(in srgb, var(--mkt-text-primary) 5%, transparent) 0%, transparent 32%); }
  /* Κοντινό: η περιοχή της οθόνης του κινητού, μεγεθυμένη, ως κάρτα με σκιά. */
  #panel { position: absolute; left: 0; top: 0; overflow: hidden; border-radius: 30px; background: var(--mkt-bg-base);
    border: 2px solid var(--mkt-border-default); box-shadow: 0 60px 120px color-mix(in srgb, var(--mkt-bg-base) 90%, transparent); }
  .spot { position: absolute; border: 3px solid var(--mkt-accent); border-radius: 12px; display: none; }
  #touch { position: absolute; border-radius: 50%; background: color-mix(in srgb, var(--mkt-text-primary) 38%, transparent);
    border: 2px solid color-mix(in srgb, var(--mkt-text-primary) 75%, transparent); display: none; }
  #touchRing { position: absolute; border-radius: 50%; border: 2px solid color-mix(in srgb, var(--mkt-text-primary) 60%, transparent); display: none; }
  #band { position: absolute; left: 0; right: 0; }
  .txt { position: absolute; text-align: left; white-space: normal; }
  .big { font-weight: 800; letter-spacing: -0.035em; line-height: 0.98; }
  .sub { font-weight: 600; letter-spacing: -0.005em; color: var(--mkt-text-secondary); line-height: 1.2; }
  .cap { font-weight: 760; line-height: 1.06; letter-spacing: -0.025em; }
  .mark { font-weight: 650; letter-spacing: 0.12em; color: var(--mkt-text-secondary); text-align: center; }
  .kicker { font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--mkt-accent); }
  #badge { position: absolute; border-radius: 999px; white-space: nowrap; display: flex; align-items: center;
    color: var(--mkt-text-secondary); background: var(--mkt-bg-surface); border: 1.5px solid var(--mkt-border-default); font-weight: 600; }
  .logo { position: absolute; transform-origin: 0 50%; }
  #url { position: absolute; border: 2px solid var(--mkt-accent); border-radius: 999px; color: var(--mkt-accent); font-weight: 650; text-align: center; }
</style>
</head>
<body>
<div id="stage">
  <div class="glow" id="g1"></div><div class="glow" id="g2"></div>
  <div id="world">
    <div class="dev" id="lap">
      <div class="lid"><div class="cam"></div><div class="screen" id="lapScreen"><div class="glass"></div></div></div>
      <div class="base"><div class="notch"></div></div>
    </div>
    <div class="dev" id="phone">
      <div class="body"></div>
      <div class="screen" id="phScreen"><div class="glass"></div></div>
      <div class="island"></div>
    </div>
  </div>
  <div id="panel"></div>
  <div id="touchRing"></div><div id="touch"></div>
  <div id="band"></div>
  <div id="texts"></div>
  <div id="badge">Δεδομένα επίδειξης</div>
  <img class="logo" id="logoT" src="/brand/properwise-logotypo-lefko.svg" alt="PROPERWISE">
  <img class="logo" id="logoC" src="/brand/properwise-logotypo-lefko.svg" alt="PROPERWISE">
  <img class="logo" id="logoS" src="/brand/properwise-logotypo-lefko.svg" alt="PROPERWISE">
  <div id="url">properwise.gr</div>
</div>
<!-- ΤΟ ΧΡΟΝΟΛΟΓΙΟ, ΜΙΑ ΠΗΓΗ: η ταινία και ο ήχος (sound.ts). Χρόνοι σε δευτερόλεπτα, πλέγμα 120 BPM.
     cuts: τέλος αγκιστριού, τέλος «Κάτι έρχεται.», αρχές DUO-A, DUO-B, ISSUER, DUO-C, E9B, TYPE, END. -->
<script id="timeline" type="application/json">
{
  "fps": 30, "dur": 25.6, "bpm": 120,
  "cuts": [2.6, 3.5, 5.3, 10.2, 13.4, 16.2, 18.8, 20.6, 22.6],
  "full": 5.3,
  "hook": [-0.2, 0.35, 0.7, 1.05, 1.4],
  "lapInbox": [6.0, 6.6],
  "consSpots": [7.4, 8.4],
  "lapSpot": 9.2,
  "inboxParts": [10.2, 10.6, 11.0, 11.4],
  "phSpot": 12.2,
  "issuerSpots": [13.8, 15.0],
  "phE9": 16.7,
  "phE9Spot": 17.6,
  "taps": [19.4],
  "type": [20.6, 21.4],
  "dings": [6.0, 11.4, 15.0, 19.6],
  "close": 22.6,
  "chords": [[0, ["A2", "E3", "A3", "C4", "E4"]], [2.6, ["F2", "C3", "F3", "A3", "C4"]], [3.5, ["C3", "G3", "C4", "E4", "G4"]], [5.3, ["D2", "A2", "D3", "F3", "A3"]], [10.2, ["F2", "C3", "F3", "A3", "C4"]], [13.4, ["C3", "G3", "C4", "E4", "G4"]], [16.2, ["D2", "A2", "D3", "F3", "A3"]], [18.8, ["G2", "D3", "G3", "B3", "D4"]], [20.6, ["F2", "C3", "F3", "A3", "E4"]], [22.6, ["A2", "E3", "A3", "C4", "E4"]]]
}
</script>
<script>
(() => {
const TL = JSON.parse(document.getElementById('timeline').textContent);
const Q = new URLSearchParams(location.search);
const fmt = Q.get('f') === '45' ? '45' : '916';
const W = 1080, H = fmt === '45' ? 1350 : 1920;
const px = Math.round, clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const $ = (id) => document.getElementById(id);
const lin = (t, a, d) => clamp((t - a) / d, 0, 1);
const ease = (u) => (u <= 0 ? 0 : u >= 1 ? 1 : u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2);
// Ελατήριο κλειστής μορφής (kinisi): ζ = 1 για κάμερα και κείμενο, ζ < 1 για σχήματα (μία μικρή υπερακόντιση).
const spring = (t, a, w = 18, z = 1) => {
  const x = t - a; if (x <= 0) return 0;
  if (z >= 1) return 1 - Math.exp(-w * x) * (1 + w * x);
  const wd = w * Math.sqrt(1 - z * z);
  return 1 - Math.exp(-z * w * x) * (Math.cos(wd * x) + (z * w / wd) * Math.sin(wd * x));
};
const CUT = TL.cuts;

// ── STORIES (teaser): ?f=916&s=1 έως 3 ───────────────────────────────────
const SN = fmt === '916' ? Number(Q.get('s')) || 0 : 0;
const E = 0.001;
const STORIES = {
  1: { logo: true, keys: [[0, 0], [CUT[1] - E, CUT[1] - E], [3.9, CUT[1] - E]] },
  // Laptop και κινητό μαζί: το παραστατικό στο laptop, ο έλεγχος στο κινητό.
  2: { cap: 'Έρχεται: τα παραστατικά από το myDATA, μέσω του λογιστή σου.', capTo: CUT[4], keys: [[0, CUT[2]], [4.3, CUT[2] + 4.3]] },
  3: { cap: 'Έρχεται: το Ε9 από το myAADE.', capTo: CUT[7],
    keys: [[0, CUT[5]], [2.4, CUT[5] + 2.4], [2.4 + E, TL.taps[0] - 0.5], [3.2, TL.taps[0] + 0.3], [3.2 + E, TL.close], [5.6, TL.close + 2.4]] },
};
const ST = STORIES[SN] || null;
const NOMARK = !!ST && Q.has('nomark');
// ?qa=1: χωρίς τα φωτεινά φόντα, για τη μέτρηση περιθωρίων (qa-frames.mjs).
const QA = Q.has('qa');
const filmT = (ts) => {
  const k = ST.keys;
  for (let i = 1; i < k.length; i++) if (ts <= k[i][0]) { const [a0, b0] = k[i - 1], [a1, b1] = k[i]; return b0 + (b1 - b0) * (ts - a0) / (a1 - a0); }
  return k[k.length - 1][1];
};

// ── ΠΛΕΓΜΑ ΚΑΙ ΔΙΑΤΑΞΗ ───────────────────────────────────────────────────
// Αριστερή στοίχιση στο x 96. Λεζάντα στη ζώνη 250 έως 420 (9:16) ή 70 έως 230 (4:5), ετικέτα από κάτω.
// Συσκευές στη ζώνη 560 έως 1500 (9:16) ή 330 έως 1250 (4:5).
// v2 καθαρό: κοινός άξονας και ίσα περιθώρια 72 px (κοντινό 312 px εφαρμογής × 3,0 = 936 px = W − 2 × 72).
const GX = 72, GW = W - 2 * GX;
// 9:16: λεζάντα από το y 300 (μέσα στο κεντρικό 4:5 του πλέγματος του προφίλ, y 285 έως 1635), ετικέτα στο 470,
// περιεχόμενο με κέντρο το y 1010. 4:5: λεζάντα από το 70, ετικέτα στο 224, κέντρο το 760.
const L = fmt === '916'
  ? { capTop: 300, capSize: 60, badgeY: 470, badgeSize: 30, big: 150, title: 104, midY: 960, cY: 1010, Z0: 560, Z1: 1500 }
  : { capTop: 70, capSize: 52, badgeY: 224, badgeSize: 26, big: 128, title: 92, midY: 675, cY: 770, Z0: 300, Z1: 1250 };
const MARGIN = 64;
const stage = $('stage');
stage.style.width = W + 'px'; stage.style.height = H + 'px';

// ── ΣΥΣΚΕΥΕΣ ─────────────────────────────────────────────────────────────
// Laptop: οθόνη 1280 × 800 (λήψη του πάγκου), σε πλάτος LSW px. Κινητό: οθόνη 390 × 844 σε ύψος PSH px.
const LSW0 = 1280, LSH0 = 800, LB = 16;
const LSW = 860, LSH = LSW * LSH0 / LSW0;
const lap = $('lap'), lid = lap.querySelector('.lid'), lapScreen = $('lapScreen');
const LIDW = LSW + 2 * LB, LIDH = LSH + 2 * LB + 6;
Object.assign(lap.style, { width: LIDW + 'px', height: LIDH + 26 + 'px' });
Object.assign(lid.style, { width: LIDW + 'px', height: LIDH + 'px' });
Object.assign(lap.querySelector('.cam').style, { left: LIDW / 2 - 4 + 'px', top: '6px' });
Object.assign(lapScreen.style, { left: LB + 'px', top: LB + 6 + 'px', width: LSW + 'px', height: LSH + 'px' });
Object.assign(lap.querySelector('.base').style, { left: 0, top: LIDH + 'px', width: LIDW + 'px', height: '26px' });
Object.assign(lap.querySelector('.notch').style, { left: LIDW / 2 - 70 + 'px', top: 0, width: '140px', height: '9px' });
const LK = LSW / LSW0; // px οθόνης ανά px λήψης laptop
// Το κινητό έχει γραμμή κατάστασης 44 px πάνω από την εφαρμογή, ώστε η νησίδα να μην κρύβει την κεφαλίδα.
const PSW = 390, PSH = 844 + 44, PB = 14, PSB = 44;
const PK = 1.0; // px οθόνης ανά px εφαρμογής κινητού (το κινητό μεγεθύνεται με transform)
const phone = $('phone'), phScreen = $('phScreen');
Object.assign(phone.style, { width: PSW + 2 * PB + 'px', height: PSH + 2 * PB + 'px' });
Object.assign(phone.querySelector('.body').style, { borderRadius: 64 + 'px' });
Object.assign(phScreen.style, { left: PB + 'px', top: PB + 'px', width: PSW + 'px', height: PSH + 'px', borderRadius: 52 + 'px' });
Object.assign(phone.querySelector('.island').style, { left: PB + PSW / 2 - 52 + 'px', top: PB + 9 + 'px', width: '104px', height: '28px' });
const addImg = (parent, src, x, y, w, h, op = 1) => { const im = document.createElement('img'); im.src = src;
  Object.assign(im.style, { left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px', opacity: String(op) }); parent.insertBefore(im, parent.querySelector('.glass')); return im; };
const lapIm = (n) => addImg(lapScreen, `work/shots9/${n}.png`, 0, 0, LSW, LSH, 0);
const LAP = { 'lap-inbox-0': lapIm('lap-inbox-0'), 'lap-inbox-1': lapIm('lap-inbox-1'), 'lap-inbox-3': lapIm('lap-inbox-3') };
const phIm = (n) => addImg(phScreen, `work/shots9/${n}.png`, 0, PSB, PSW, PSH - PSB, 0);
const PH = { 'ph-consent': phIm('ph-consent') };
const mkSpot = (parent) => { const d = document.createElement('div'); d.className = 'spot'; parent.insertBefore(d, parent.querySelector('.glass')); return d; };
const lapSpot = mkSpot(lapScreen), phSpot = mkSpot(phScreen);

// ── ΚΟΝΤΙΝΑ (panel): η περιοχή του κινητού σε κλίμακα 3,0 (γράμματα 12 και 13 px → 36 και 39 px) ──
const panel = $('panel');
const panelImgs = {};
const pImg = (key, src, r) => { const im = document.createElement('img'); im.src = src; panel.appendChild(im); panelImgs[key] = { im, r }; return im; };
pImg('inboxEmpty', 'work/shots9/inbox-empty.png', { x: 0, y: 119, w: 390, h: 371 });
pImg('p0', 'work/shots9/inbox-part-0.png', { x: 48, y: 210, w: 294, h: 20 });
pImg('p2', 'work/shots9/inbox-part-2.png', { x: 48, y: 286, w: 294, h: 36 });
pImg('e9b', 'work/shots9/e9-bottom.png', { x: 0, y: 534, w: 390, h: 310 });
pImg('q1', 'work/shots9/inbox-part-1.png', { x: 48, y: 240, w: 294, h: 36 });
pImg('q2', 'work/shots9/inbox-part-2.png', { x: 48, y: 286, w: 294, h: 36 });
pImg('q3', 'work/shots9/inbox-part-3.png', { x: 48, y: 332, w: 294, h: 146 });
pImg('e9listEmpty', 'work/shots9/e9-list-empty.png', { x: 0, y: 349, w: 390, h: 361 });
pImg('e9i0', 'work/shots9/e9-item-0.png', { x: 25, y: 357, w: 340, h: 178 });
pImg('e9i1', 'work/shots9/e9-item-1.png', { x: 25, y: 544, w: 340, h: 158 });
const panelSpot = document.createElement('div'); panelSpot.className = 'spot'; panel.appendChild(panelSpot);
// Κάθε κοντινό: ίδιο πλάτος 312 px εφαρμογής × 3,0 = 936 px κάδρου = W − 2 × 72 (ίσα περιθώρια), κέντρο στο L.cY.
const PW_APP = 312;
const PANELS = {
  inbox: { imgs: ['inboxEmpty', 'q1', 'q2', 'q3', 'p0'], x0: 39, y0: 197, y1: 482, s: 3.0 },
  issuer: { imgs: ['inboxEmpty', 'p0', 'p2'], x0: 39, y0: 197, y1: 334, s: 3.0 },
  e9: { imgs: ['e9listEmpty', 'e9i0', 'e9i1'], x0: 25, y0: 352, y1: 644, s: 3.0 },
  e9b: { imgs: ['e9b'], x0: 25, y0: 712, y1: 844, s: 3.0 },
};
// ── ΣΚΗΝΕΣ: θέσεις συσκευών (κέντρο x, y, κλίμακα, κλίση Y) και περιεχόμενο ──
const OFF = { x: 540, y: 2600, k: 1, ry: 0, o: 0 };
// ΜΙΑ σκηνή με τις δύο συσκευές, χωρίς κλίση: laptop αριστερά από το x 96, κινητό μπροστά δεξιά ως το x W − 96,
// με κοινή βάση. Οι υπόλοιπες σκηνές είναι κοντινά της οθόνης του κινητού.
const LAPK = fmt === '45' ? 0.86 : 0.8, PHK = fmt === '45' ? 0.62 : 0.78;
const lapW = (LSW + 2 * LB) * LAPK, lapH = (LSH + 2 * LB + 6 + 26) * LAPK, phW = (PSW + 2 * PB) * PHK, phH = (PSH + 2 * PB) * PHK;
const floorY = L.cY + phH / 2;
const DUO = { lap: { x: GX + lapW / 2, y: floorY - lapH / 2, k: LAPK, ry: 0 }, phone: { x: W - GX - phW / 2, y: floorY - phH / 2, k: PHK, ry: 0 } };
const SCENES = [
  { from: CUT[2], ...DUO },
  { from: CUT[3], lap: { ...OFF }, phone: { ...OFF }, panel: 'inbox' },
  { from: CUT[4], lap: { ...OFF }, phone: { ...OFF }, panel: 'issuer' },
  { from: CUT[5], lap: { ...OFF }, phone: { ...OFF }, panel: 'e9' },
  { from: CUT[6], lap: { ...OFF }, phone: { ...OFF }, panel: 'e9b' },
  { from: CUT[7], lap: { ...OFF }, phone: { ...OFF } },
];
const sceneAt = (t) => [...SCENES].reverse().find((s) => t >= s.from) || null;
// Βύθιση: 0,4″ γύρω από κάθε αλλαγή σκηνής· εκεί κινούνται οι συσκευές και το περιεχόμενο είναι στο 25%.
const DIP = 0.4;

// ── ΚΕΙΜΕΝΑ ──────────────────────────────────────────────────────────────
const texts = $('texts'), T = [];
function text(cls, s, style, tin, tout) {
  const el = document.createElement('div'); el.className = 'txt ' + cls; el.textContent = s;
  Object.assign(el.style, style); texts.appendChild(el); T.push({ el, tin, tout }); return el;
}
const grid = (top, size, w = GW) => ({ left: GX + 'px', top: top + 'px', width: w + 'px', fontSize: size + 'px' });
// Αγκίστρι: μία λέξη ανά χτύπημα, σε στοίβα με αριστερή στοίχιση.
const HOOK = ['Ε9.', 'ΕΝΦΙΑ.', 'Κωδικοί.', 'PDF.', 'Email.'];
const hookEls = HOOK.map((w, i) => text('big', w, { ...grid(0, L.big), color: i === HOOK.length - 1 ? 'var(--mkt-accent)' : '' }, TL.hook[i], CUT[0]));
const TEASE = 'Κάτι έρχεται.';
const teaseEl = text('big', TEASE, { ...grid(0, L.big * 0.92), color: 'var(--mkt-accent)' }, CUT[0], CUT[1]);
const TITLE = ['Το PROPERWISE συνδέεται με την ΑΑΔΕ.'];
const SUB = 'Μέσω του λογιστή σου και του myAADE';
const titleEl = text('big', TITLE[0], grid(0, L.title), CUT[1], CUT[2]);
const subEl = text('sub', SUB, grid(0, L.title * 0.42), CUT[1], CUT[2]);
const CAPS = ST ? (ST.cap ? [[0, ST.capTo, ST.cap]] : []) : [
  [CUT[2], CUT[3], 'Από το myDATA, μέσω του λογιστή σου.'],
  [CUT[3], CUT[4], 'Δεν τα ψάχνεις. Τα ελέγχεις.'],
  [CUT[4], CUT[5], 'Με τον ΜΑΡΚ της ΑΑΔΕ. Χωρίς αντιγραφή με το χέρι.'],
  [CUT[5], CUT[7], 'Το Ε9 από το myAADE, σε λίγα πατήματα.'],
];
const capEls = CAPS.map(([a, b, s]) => text('cap', s, grid(L.capTop, L.capSize), a, b));
// Τυπογραφικός χτύπος και τελικό καρέ.
const TYPE = ['Λιγότερα clicks.', 'Λιγότερα λάθη.'];
const typeEls = TYPE.map((s, i) => text('big', s, { ...grid(0, L.title * 0.92), color: i ? 'var(--mkt-accent)' : '' }, TL.type[i], CUT[8]));
const MSG = ['Λιγότερα clicks. Λιγότερα λάθη.'];
const PLAN = 'Ιδιοκτήτης+';
const CTA = `Έρχεται στο ${PLAN}.`;
const FOLLOW = 'Ακολούθησε για να το δεις πρώτος.';
const msgEl = text('sub', MSG[0], grid(0, L.title * 0.46), TL.close, TL.dur + 1);

const badge = $('badge'), logoT = $('logoT'), logoC = $('logoC'), logoS = $('logoS'), url = $('url'), band = $('band');

// ── ΠΡΟΒΟΛΕΙΣ: [από, ως, πού, κουτί σε px της λήψης] ─────────────────────

  [TL.consSpots[0], TL.consSpots[1], 'ph', { x: 31, y: 135, w: 170, h: 24 }],

// ── render(t) ────────────────────────────────────────────────────────────
const S = (el) => el.style;
function devTransform(d, el, base) {
  const x = d.x, y = d.y, k = d.k;

}
const mix = (a, b, u) => ({ x: a.x + (b.x - a.x) * u, y: a.y + (b.y - a.y) * u, k: a.k + (b.k - a.k) * u, ry: a.ry + (b.ry - a.ry) * u });
function renderFilm(t) {
  const sig = [];
  Object.assign(S($('g1')), { width: '1300px', height: '1300px', left: px(-300 + 160 * Math.sin(t / 4.2)) + 'px', top: px(H * 0.25 + 110 * Math.cos(t / 5.3)) + 'px' });
  Object.assign(S($('g2')), { width: '1100px', height: '1100px', left: px(460 + 140 * Math.cos(t / 3.7)) + 'px', top: px(H * 0.55 + 100 * Math.sin(t / 4.9)) + 'px' });

  let lapD = OFF, phD = OFF, dim = 1;
  if (sc) {

    // Η κίνηση ξεκινά στη μέση της βύθισης πριν από την κοπή και φτάνει (ελατήριο ζ = 1) μέσα στη βύθιση μετά.

  S(lap).display = devOn ? 'block' : 'none'; S(phone).display = devOn ? 'block' : 'none';
  S(lap).transform = devTransform(lapD, lap); S(phone).transform = devTransform(phD, phone);
  lapScreen.style.opacity = dim.toFixed(3); phScreen.style.opacity = dim.toFixed(3);

  {
    lapShow('lap-inbox-0');
    const a = lin(t, TL.lapInbox[0], 0.2), b = lin(t, TL.lapInbox[1], 0.2);
    LAP['lap-inbox-1'].style.opacity = (a * (1 - b)).toFixed(3); LAP['lap-inbox-3'].style.opacity = b.toFixed(3);

  }

  phOn('ph-consent');

  const pn = sc && sc.panel ? PANELS[sc.panel] : null;

    const u = spring(t, sc.from - DIP / 2, 22, 1);
    Object.assign(S(panel), { width: pw + 'px', height: ph + 'px', left: GX + 'px', top: px(L.cY - ph / 2 + (1 - u) * 40) + 'px', opacity: dim.toFixed(3) });
    for (const [key, { im, r }] of Object.entries(panelImgs)) {
      const on = pn.imgs.includes(key);
      const rev = { q1: TL.inboxParts[1], q2: TL.inboxParts[2], q3: TL.inboxParts[3], e9i1: TL.phE9 }[key];
      im.style.opacity = rev === undefined ? '1' : lin(t, rev, 0.18).toFixed(3);
      Object.assign(im.style, { display: on ? 'block' : 'none', left: (r.x - pn.x0) * pn.s + 'px', top: (r.y - pn.y0) * pn.s + 'px', width: r.w * pn.s + 'px', height: r.h * pn.s + 'px' });

  for (const [a, b, where, r] of SPOTS) if (t >= a && t < b) {

    const kk = where === 'lap' ? LK : where === 'ph' ? PK : (pn ? pn.s : 1);

  for (const [b, where, p] of TAPS) {
    if (!pn) continue;
    const d = t - b; let press = 0, ring = -1;
    if (d > -0.18 && d < 0.12) press = d < 0 ? clamp((d + 0.18) / 0.12, 0, 1) : clamp(1 - d / 0.12, 0, 1);
    if (d >= 0 && d < 0.45) ring = d / 0.45;
    const pr = panel.getBoundingClientRect ? null : null;
    const cx = parseFloat(panel.style.left) + (p[0] - pn.x0) * pn.s, cy = parseFloat(panel.style.top) + (p[1] - pn.y0) * pn.s;
    if (press > 0.01) { const r = 44 * (1.12 - 0.12 * press); Object.assign(tr.style, { display: 'block', left: cx - r + 'px', top: cy - r + 'px', width: 2 * r + 'px', height: 2 * r + 'px', opacity: (0.95 * press).toFixed(3) }); }
    if (ring >= 0) { const r = 44 * (1 + 1.1 * ease(ring)); Object.assign(rg.style, { display: 'block', left: cx - r + 'px', top: cy - r + 'px', width: 2 * r + 'px', height: 2 * r + 'px', opacity: (0.8 * (1 - ring)).toFixed(3) }); }
    sig.push(press.toFixed(3), ring.toFixed(3));

  for (const e of T) { const o = t >= e.tin && t < e.tout ? 1 : 0; e.el.style.display = o ? 'block' : 'none'; sig.push(o); }
  // Κείμενα: κάθε γραμμή μπαίνει με ελατήριο ζ = 1 (ανεβαίνει 28 px), σε ακέραια px.
  const rise = (el, a) => { const u = spring(t, a, 20, 1); el.style.transform = `translateY(${px((1 - u) * 28)}px)`; el.style.opacity = Math.min(1, u * 1.6).toFixed(3); };

  typeEls.forEach((el, i) => rise(el, TL.type[i]));
  for (const el of [msgEl, ctaEl, followEl]) rise(el, TL.close);
  capEls.forEach((el, i) => { if (el.style.display === 'block') rise(el, CAPS[i][0]); });
  const cOn = t >= TL.close;
  for (const el of [logoC, url]) { S(el).display = cOn ? 'block' : 'none'; }
  const tOn = t >= CUT[1] && t < CUT[2];
  S(logoT).display = tOn ? 'block' : 'none';
  S(badge).display = devOn || (sc && sc.panel) ? 'flex' : 'none';
  S(band).display = ST ? 'block' : 'none';
  return sig.join('|');
}
if (QA) { $('g1').style.visibility = 'hidden'; $('g2').style.visibility = 'hidden'; }
window.render = ST ? (ts) => renderFilm(filmT(ts)) : renderFilm;
window.ready = async () => {
  await Promise.all([...document.images].map((im) => im.decode()));
  await document.fonts.load('800 50px Inter', 'ΑΒΓαβγ€0123'); await document.fonts.ready;
  // Λεζάντα το πολύ σε δύο γραμμές.
  for (const el of capEls) {
    el.style.display = 'block';
    let fs = parseFloat(el.style.fontSize);
    while (el.offsetHeight > fs * 1.06 * 2 + 4 && fs > L.capSize * 0.7) { fs *= 0.96; el.style.fontSize = fs.toFixed(2) + 'px'; }
    el.style.display = 'none';
  }
  // Οπτική στοίχιση: το μελάνι του πρώτου γράμματος κάθε κειμένου πέφτει ακριβώς στο x GX (όχι η αρχή του κουτιού).
  const cv = document.createElement('canvas').getContext('2d');

    const cs = getComputedStyle(el); cv.font = `${cs.fontWeight} ${cs.fontSize} Inter`;
    const m = cv.measureText(el.textContent.trim()[0]);

  }

    const hs = els.map((el) => { const d = el.style.display; el.style.display = 'block'; const h = el.offsetHeight; el.style.display = d; return h; });
    let y = cy - (hs.reduce((a, b) => a + b, 0) + gaps.reduce((a, b) => a + b, 0)) / 2;
    els.forEach((el, i) => { el.style.top = px(y) + 'px'; y += hs[i] + (gaps[i] ?? 0); });
  };

  stack([teaseEl], L.midY, []);
  stack([logoT, titleEl, subEl], L.midY, [64, 40]);
  stack(typeEls, L.midY, [8]);
  stack([logoC, msgEl, ctaEl, followEl, url], L.midY, [64, 28, 36, 64]);

};
