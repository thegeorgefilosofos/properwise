
# Edge function configuration. verify_jwt governs whether the Supabase gateway
# requires a valid JWT before the function runs:
#   false  → cron / token / service functions that enforce their own auth
#            (x-cron-secret, capability token, or service-role bearer) and must be
#            reachable by pg_net/cron without a user session.
#   true   → user-facing functions that require the caller's own JWT.
# Καμία function δεν χρησιμοποιεί import map. Τέσσερα deno.json υπήρχαν εδώ και
# ήταν ΝΕΚΡΑ: δήλωναν «@supabase/functions-js» και «@supabase/server», specifiers
# που κανένα index.ts δεν εισήγαγε ποτέ. Γεννήθηκαν από `supabase functions new`
# — στο ίδιο commit που τα δημιούργησε, ο κώδικας ήδη έκανε import από αλλού.
# Ήταν αβλαβή (οι αχρησιμοποίητες καταχωρήσεις δεν επιλύονται ποτέ) αλλά δήλωναν
# κυμαινόμενα εύρη ^2 και ^1 — ακριβώς η ασθένεια που μόλις διώξαμε από τα
# imports. Οι εξαρτήσεις δηλώνονται πλέον inline: npm:<pkg>@<ακριβής έκδοση>.

# ── User-facing (require the caller's JWT) ──────────────────────────────────
[functions.smart-suggestions]
enabled = true
verify_jwt = true

[functions.send-client-email]
enabled = true
verify_jwt = true

[functions.send-org-invite]
enabled = true
verify_jwt = true

[functions.send-test-notification]
enabled = true
verify_jwt = true

# ── Cron / token / service (enforce their own auth) ─────────────────────────
[functions.send-reminders]
enabled = true
verify_jwt = false

[functions.ical-sync]
enabled = true
verify_jwt = false

[functions.bookings-feed]
enabled = true
verify_jwt = false

[functions.schedule-email-outbox]
enabled = true
verify_jwt = false

[functions.send-lifecycle-email]
enabled = true
verify_jwt = false

[functions.send-newsletter]
enabled = true
verify_jwt = false

[functions.send-market-digest]
enabled = true
verify_jwt = false

[functions.send-monthly-statements]
enabled = true
verify_jwt = false

[functions.notify-mobile-launch]
enabled = true
verify_jwt = false

[functions.market-data-updater]
enabled = true
verify_jwt = false

[functions.bank-rates-updater]
enabled = true
verify_jwt = false

[functions.purge-orphan-files]
enabled = true
verify_jwt = false

# Την καλεί το pg_cron κάθε τέταρτο με «x-cron-secret», χωρίς συνεδρία χρήστη:
# κρίνει μόνη της την ταυτότητα με authorizeCron.
[functions.health-check]
enabled = true
verify_jwt = false

# ═══════════════════════════════════════════════════════════════════════════
# ΤΟ ΔΕΥΤΕΡΟ ΒΗΜΑ, ΓΡΑΜΜΕΝΟ ΚΑΙ ΟΧΙ ΜΟΝΟ ΠΑΤΗΜΕΝΟ ΣΕ ΠΙΝΑΚΑ ΕΛΕΓΧΟΥ
# ─────────────────────────────────────────────────────────────────────────
# ΤΙ ΜΕΤΡΗΘΗΚΕ. Το αρχείο είχε ΜΟΝΟ ενότητες «[functions.*]». Η ρύθμιση που
# επιτρέπει σε χρήστη να δηλώσει συσκευή TOTP ζούσε αποκλειστικά στον πίνακα
# ελέγχου του παρόχου: καμία γραμμή του αποθετηρίου δεν την έλεγε, κανένας
# έλεγχος δεν την επαλήθευε και μια αλλαγή της δεν άφηνε ίχνος σε κανένα diff.
# Αν κάποιος τη γυρίσει σε «Verify Enabled», το `mfa.enroll()` απορρίπτεται,
# κανείς δεν ενεργοποιεί δεύτερο βήμα και η δημόσια σελίδα /trust ξαναγίνεται
# ψευδής — σιωπηλά.
#
# ⚠️ ΠΡΟΣΟΧΗ ΠΡΙΝ ΜΠΕΙ ΒΗΜΑ «supabase config push» ΣΤΟ CI. Σήμερα το
# .github/workflows/supabase-deploy.yml τρέχει «link», «functions deploy» και
# «db push» — ΟΧΙ «config push». Δηλαδή αυτή η ενότητα ισχύει μόνο για τοπικό
# «supabase start». Ενα «config push» με ΜΙΣΗ ενότητα [auth] ΣΒΗΝΕΙ ό,τι λείπει
# από εδώ: site_url, additional_redirect_urls, τον πάροχο Google. Θα έσπαγε τη
# σύνδεση με Google και κάθε σύνδεσμο email σε ένα deploy. Πριν προστεθεί το
# βήμα, αντίγραψε ΟΛΟΚΛΗΡΗ την τρέχουσα ρύθμιση από τον πίνακα ελέγχου.
# ═══════════════════════════════════════════════════════════════════════════
[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
# ΚΑΙ ΤΑ ΔΥΟ, ΟΧΙ ΜΟΝΟ ΤΟ ΔΕΥΤΕΡΟ. Με «enroll_enabled = false» η επαλήθευση
# δουλεύει αλλά κανείς δεν μπορεί ΠΟΤΕ να δηλώσει πρώτη συσκευή.
enroll_enabled = true
verify_enabled = true
