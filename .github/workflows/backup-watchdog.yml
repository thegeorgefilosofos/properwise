name: Backup watchdog

# ═══════════════════════════════════════════════════════════════════════════
# ΤΟ ΠΡΟΒΛΗΜΑ ΠΟΥ ΛΥΝΕΙ
# Ένα αντίγραφο ασφαλείας που σταματά να γίνεται δεν κάνει θόρυβο. Το GitHub
# στέλνει email σε αποτυχία scheduled workflow, αλλά αυτά χάνονται στα υπόλοιπα.
# Το χειρότερο σενάριο δεν είναι καν η αποτυχία — είναι η ΣΙΩΠΗ:
#   • λήγει το SUPABASE_ACCESS_TOKEN και το job σκάει κάθε βράδυ
#   • το GitHub απενεργοποιεί τα scheduled workflows μετά από 60 ημέρες
#     αδράνειας στο repo, χωρίς να ξαναρωτήσει
#   • το job γράφει «success» αλλά δεν ανέβασε τίποτα
# Και στις τρεις περιπτώσεις νομίζεις ότι έχεις αντίγραφα, μέχρι τη μέρα που
# τα χρειάζεσαι.
#
# ΤΙ ΚΑΝΕΙ
# Κάθε μέρα ελέγχει ότι υπάρχει ΕΠΙΤΥΧΗΜΕΝΟ backup μέσα στο παράθυρο ανοχής
# (48 ώρες = δύο μέρες στη σειρά) και ότι το αντίγραφο ΥΠΑΡΧΕΙ ΠΡΑΓΜΑΤΙΚΑ στο
# ιδιωτικό bucket `db-backups` και είναι ΚΡΥΠΤΟΓΡΑΦΗΜΕΝΟ. Δεν εμπιστεύεται το
# «success» του job: διαβάζει τη λίστα αρχείων του bucket (ονόματα, όχι
# περιεχόμενο) και επιβεβαιώνει ότι είναι .gpg.
#
# ΠΩΣ ΕΙΔΟΠΟΙΕΙ
# Ανοίγει GitHub issue. Επίτηδες — ένα issue είναι ΚΑΤΑΣΤΑΣΗ, όχι μήνυμα:
# μένει ανοιχτό μέχρι να λυθεί, φαίνεται στην αρχική του repo και φτάνει ως
# push στο κινητό αν έχεις την εφαρμογή GitHub. Ένα email διαβάζεται μία φορά
# και ξεχνιέται. Όταν το backup ξαναγίνει, το issue κλείνει ΜΟΝΟ του.
#
# Ο ΙΔΙΟΣ Ο ΦΥΛΑΚΑΣ: αν σπάσει αυτό το workflow, το GitHub στέλνει το κλασικό
# email αποτυχίας. Δεν βάζουμε φύλακα στον φύλακα — κάπου σταματάει.
# ═══════════════════════════════════════════════════════════════════════════

on:
  schedule:
    - cron: '0 5 * * *'      # 05:00 UTC, τρεις ώρες μετά το backup των 02:00
  workflow_dispatch: {}

permissions:
  issues: write              # άνοιγμα/κλείσιμο της ειδοποίησης
  contents: read

env:
  # Παράθυρο ανοχής. 48 ώρες = «δεν έγινε δύο μέρες στη σειρά».
  MAX_AGE_HOURS: '48'
  # Τα αρχεία των χρηστών γράφονται κάθε Κυριακή: 8 ημέρες = χάθηκε μία εβδομάδα.
  FILES_MAX_DAYS: '8'
  SUPABASE_PROJECT_REF: aromvduuxtcrzmwwvnej
  ALARM_TITLE: '🔴 Το αντίγραφο ασφαλείας της βάσης δεν γίνεται'

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: scripts/backup

      - name: Κλειδί service role (κρυμμένο)
        id: key
        # Ληγμένο token = ειδοποίηση με issue, όχι σιωπηλό κόκκινο.
        continue-on-error: true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: bash scripts/backup/service-key.sh

      - name: Έλεγχος του αντιγράφου στον ιδιωτικό χώρο
        id: check
        run: |
          set -euo pipefail
          # Δεν εμπιστεύεται το «success» της ροής: κοιτά τι ΥΠΑΡΧΕΙ στο bucket.
          # Η τελευταία σφραγισμένη ημέρα (με manifest) πρέπει να είναι μέσα στο
          # παράθυρο ανοχής, με κάθε κομμάτι στη θέση του και ΜΟΝΟ .gpg. Το πιο
          # πρόσφατο σετ αρχείων χρηστών πρέπει να είναι πλήρες και φρέσκο.
          if [ -z "${SUPABASE_SERVICE_KEY:-}" ]; then
            echo "healthy=false" >> "$GITHUB_OUTPUT"
            echo "reason=Ο φύλακας δεν πήρε κλειδί για τον ιδιωτικό χώρο: το SUPABASE_ACCESS_TOKEN λείπει ή έληξε. Με το ίδιο token τρέχει και το αντίγραφο." >> "$GITHUB_OUTPUT"
            exit 0
          fi
          verdict=$(node scripts/backup/vault.mjs check "$MAX_AGE_HOURS" "$FILES_MAX_DAYS") \
            || verdict='{"ok":false,"reason":"Ο ιδιωτικός χώρος των αντιγράφων δεν απάντησε."}'
          if [ "$(echo "$verdict" | jq -r '.ok')" = "true" ]; then
            day=$(echo "$verdict" | jq -r '.day')
            echo "healthy=true" >> "$GITHUB_OUTPUT"
            echo "finished=$day" >> "$GITHUB_OUTPUT"
            fday=$(echo "$verdict" | jq -r '.filesDay')
            echo "detail=αντίγραφο της $day στο db-backups, πλήρες και κρυπτογραφημένο· αρχεία χρηστών της $fday" >> "$GITHUB_OUTPUT"
          else
            echo "healthy=false" >> "$GITHUB_OUTPUT"
            echo "reason=$(echo "$verdict" | jq -r '.reason')" >> "$GITHUB_OUTPUT"
          fi

      - name: Ειδοποίηση όταν το αντίγραφο λείπει
        if: steps.check.outputs.healthy == 'false'
        run: |
          set -euo pipefail
          # ΟΧΙ αναζήτηση: το ευρετήριο του GitHub αργεί λεπτά, οπότε ένα φρεσκο-
          # ανοιγμένο issue δεν βρίσκεται και θα άνοιγε διπλότυπο κάθε μέρα. Η λίστα
          # ανοιχτών issues είναι άμεση και συνεπής.
          existing=$(gh issue list --repo "$REPO" --state open --limit 100 \
                     --json number,title \
                     --jq '[.[] | select(.title | test("αντίγραφο ασφαλείας")) | .number] | first // empty')

          body=$(cat <<EOF
          ## Τι συμβαίνει

          ${{ steps.check.outputs.reason }}

          Ελέγχθηκε στις $(date -u '+%d/%m/%Y %H:%M UTC') από το \`backup-watchdog\`.

          ## Γιατί έχει σημασία

          Το Supabase Free **δεν κρατά δικά του αντίγραφα**. Αυτό το ημερήσιο dump είναι
          το μόνο δίχτυ. Όσο δεν γίνεται, μια λάθος διαγραφή ή μια κακή migration δεν
          αναιρείται με τίποτα.

          ## Τι να ελέγξεις, με σειρά

          1. **Actions → Database backup** — τρέχει καθόλου; Αν το τελευταίο run είναι
             παλιό, το GitHub μπορεί να απενεργοποίησε το χρονοδιάγραμμα λόγω αδράνειας
             (συμβαίνει μετά από 60 ημέρες χωρίς commit). Πάτα **Enable workflow**.
          2. **Το τελευταίο run που απέτυχε** — διάβασε το σφάλμα. Το πιο συχνό είναι
             ληγμένο \`SUPABASE_ACCESS_TOKEN\`.
          3. **Settings → Secrets → Actions** — υπάρχουν και τα τρία;
             (Το \`SUPABASE_ACCESS_TOKEN\` χρειάζεται και ο ίδιος ο φύλακας για να δει το bucket.)
             \`SUPABASE_ACCESS_TOKEN\`, \`SUPABASE_DB_PASSWORD\`, \`BACKUP_PASSPHRASE\`.
          4. Τρέξε το χειροκίνητα (**Run workflow**) για να επιβεβαιώσεις τη διόρθωση.

          ## Πότε κλείνει

          Μόνο του, μόλις γίνει ξανά επιτυχημένο κρυπτογραφημένο αντίγραφο.
          Μην το κλείσεις με το χέρι χωρίς να το διορθώσεις — θα ξανανοίξει αύριο.
          EOF
          )

          if [ -n "$existing" ]; then
            echo "Το issue #$existing είναι ήδη ανοιχτό — προσθήκη σχολίου αντί για διπλότυπο."
            gh issue comment "$existing" --repo "$REPO" --body "Εξακολουθεί να ισχύει: ${{ steps.check.outputs.reason }} ($(date -u '+%d/%m %H:%M UTC'))"
          else
            gh issue create --repo "$REPO" --title "$ALARM_TITLE" --body "$body"
          fi

          # Το job αποτυγχάνει επίτηδες: κόκκινο στο Actions ΚΑΙ email από το GitHub.
          echo "::error::${{ steps.check.outputs.reason }}"
          exit 1

      - name: Κλείσιμο ειδοποίησης όταν επανέλθει
        if: steps.check.outputs.healthy == 'true'
        run: |
          set -euo pipefail
          echo "✅ Αντίγραφο ασφαλείας εντάξει — ${{ steps.check.outputs.detail }} " >> "$GITHUB_STEP_SUMMARY"

          existing=$(gh issue list --repo "$REPO" --state open --limit 100 \
                     --json number,title \
                     --jq '[.[] | select(.title | test("αντίγραφο ασφαλείας")) | .number] | first // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$REPO" \
              --body "✅ Επανήλθε. Τελευταίο επιτυχημένο κρυπτογραφημένο αντίγραφο: ${{ steps.check.outputs.finished }} (${{ steps.check.outputs.detail }}). Κλείνει αυτόματα."
            gh issue close "$existing" --repo "$REPO"
          fi
